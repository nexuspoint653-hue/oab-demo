<!doctype html>
<html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>OAB Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@600;700;800&family=Chakra+Petch:wght@700&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#121314;--s1:#1A1B1D;--s2:#232427;--s3:#2A2C2F;--border:#2E3033;--border-2:#3A3D41;
  --text:#F2F2F0;--text-2:#A3A6AB;--text-3:#6B6F75;
  --red:#D7262B;--red-h:#EF3A3F;--red-t:#D7262B1A;--red-t2:#D7262B33;
  --gold:#C8A96A;--gold-t:#C8A96A1F;
  --ok:#3FB67A;--ok-t:#3FB67A1F;--warn:#E0A33A;--warn-t:#E0A33A1F;--err:#F0524F;--err-t:#F0524F1F;--info:#5B9BD5;--info-t:#5B9BD51F;
  --f-disp:"Geist",ui-sans-serif,system-ui,sans-serif;
  --f-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;--r-sm:7px;--r-lg:14px;
  --side:236px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:-.01em}
h1,h2,h3,h4{margin:0;font-family:var(--f-disp);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);font-weight:500}
.muted{color:var(--text-2)}.dim{color:var(--text-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px}
.brand-mark{width:30px;height:30px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;color:#fff;flex:none;box-shadow:inset 0 0 0 2px #ffffff22}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:16px;letter-spacing:.01em;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--text-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);padding:12px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-2);font-size:13.5px;transition:background .15s,color .15s}
.nav a:hover{background:var(--s2);color:var(--text)}
.nav a.on{background:var(--s2);color:var(--text)}
.nav a.on svg{color:var(--red)}
.nav a .ct{margin-left:auto;font-size:11px;background:var(--s3);color:var(--text-2);padding:1px 7px;border-radius:20px}
.nav a.on .ct{background:var(--red-t2);color:#ffb3b5}
.nav svg{width:17px;height:17px;flex:none}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:14px;display:flex;align-items:center;gap:10px;padding-inline:6px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;background:var(--s3);color:var(--text)}
.av.gold{background:var(--gold-t);color:var(--gold);box-shadow:inset 0 0 0 1px #C8A96A55}
.av.sm{width:24px;height:24px;font-size:10px}
.av.lg{width:64px;height:64px;font-size:22px;font-family:var(--f-disp)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#121314e6;backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:12px 28px}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:7px 11px;color:var(--text-3)}
.search input{background:none;border:0;outline:0;flex:1;min-width:0;color:var(--text)}
.search kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--border-2);border-radius:5px;padding:0 5px;color:var(--text-3)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border);background:var(--s1);position:relative}
.icon-btn:hover{color:var(--text);border-color:var(--border-2)}
.icon-btn svg{width:17px;height:17px}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--s1)}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);padding:0 4px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-t);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
.menu-btn{display:none}

.view{padding:26px 28px 60px;display:flex;flex-direction:column;gap:22px;max-width:1480px;width:100%}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-size:30px;line-height:1.1}
.head .sub{color:var(--text-2);margin-top:6px;font-size:13.5px}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- atoms ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--s1);color:var(--text);transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--s2);border-color:var(--border-2)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-h);border-color:var(--red-h)}
.btn.ghost{background:none;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{color:var(--text);background:var(--s2)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:6px;font-size:12.5px;color:var(--text-2)}
.seg button.on{background:var(--s3);color:var(--text)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:20px;background:var(--s3);color:var(--text-2);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-t);color:var(--ok)}.pill.warn{background:var(--warn-t);color:var(--warn)}.pill.err{background:var(--err-t);color:var(--err)}.pill.info{background:var(--info-t);color:var(--info)}.pill.red{background:var(--red-t2);color:#ff9ea1}.pill.gold{background:var(--gold-t);color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text-2);background:var(--s1)}
.chip.on{border-color:var(--red);color:var(--text);background:var(--red-t)}

.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card-h h3{font-size:15.5px}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:16px 18px 18px}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g-main-r{grid-template-columns:minmax(0,1fr) minmax(0,1.65fr)}

.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.kpi .lbl{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--f-disp);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em}
.kpi .val small{font-size:15px;color:var(--text-2);font-weight:500;margin-left:2px}
.kpi .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.delta{font-size:12px;font-weight:500}
.delta.up{color:var(--ok)}.delta.dn{color:var(--err)}
.spark{width:84px;height:28px}

.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;font-size:11.5px;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr.link{cursor:pointer}
.tbl tbody tr.link:hover{background:var(--s2)}
.tbl td.r,.tbl th.r{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.who b{font-weight:500;display:block}
.who span{font-size:12px;color:var(--text-3)}

.rating{display:inline-flex;align-items:center;gap:8px}
.grade{font-family:var(--f-disp);font-weight:700;font-size:13px;width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.gA{background:var(--ok-t);color:var(--ok)}.gB{background:var(--info-t);color:var(--info)}.gC{background:var(--warn-t);color:var(--warn)}.gD{background:var(--err-t);color:var(--err)}
.bar{height:6px;border-radius:6px;background:var(--s3);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--text-2)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:12px;color:var(--text-3)}

.sev{width:3px;align-self:stretch;border-radius:3px;flex:none}
.sev.err{background:var(--err)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}.sev.ok{background:var(--ok)}

/* ---------- autonomy brief ---------- */
.brief{background:linear-gradient(180deg,#1C1D1F, #1A1B1D);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;position:relative;overflow:hidden}
.brief::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
.brief h2{font-size:24px;line-height:1.2;margin-top:8px;max-width:30ch}
.brief p.lead{color:var(--text-2);margin-top:10px;max-width:62ch}
.brief .tag{display:inline-flex;align-items:center;gap:7px;color:var(--gold);font-size:12px;font-weight:500}
.brief .tag svg{width:14px;height:14px}
.score-row{display:flex;gap:26px;margin-top:20px;flex-wrap:wrap}
.score-row div b{font-family:var(--f-disp);font-size:22px;font-weight:600;display:block;line-height:1.1}
.score-row div span{font-size:12px;color:var(--text-3)}
.actions{display:flex;flex-direction:column;gap:8px}
.act{display:flex;gap:12px;align-items:flex-start;background:var(--s2);border:1px solid var(--border);border-radius:11px;padding:12px}
.act .t{flex:1;min-width:0}
.act .t b{font-weight:500;font-size:13.5px;display:block}
.act .t span{font-size:12.5px;color:var(--text-2)}
.act .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.act .ic svg{width:15px;height:15px}
.act.done{opacity:.5}
.act.done .btn{pointer-events:none}

/* ---------- ring ---------- */
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;text-align:center}
.ring .in b{font-family:var(--f-disp);font-weight:700;display:block;line-height:1}
.ring .in span{font-size:11px;color:var(--text-3)}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);display:flex;flex-direction:column;min-height:300px}
.col-h{display:flex;align-items:center;gap:8px;padding:13px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:500}
.col-h .n{color:var(--text-3);font-weight:400}
.col-h .amt{margin-left:auto;font-size:12px;color:var(--text-3)}
.col-b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.col.drop .col-b{background:var(--red-t);border-radius:0 0 var(--r-lg) var(--r-lg)}
.kc{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px;cursor:grab}
.kc:hover{border-color:var(--border-2)}
.kc.drag{opacity:.4}
.kc .r1{display:flex;align-items:center;gap:8px}
.kc .r1 b{font-weight:500;font-size:13.5px}
.kc .r1 .mono{margin-left:auto;color:var(--text-3)}
.kc .car{font-size:12.5px;color:var(--text-2)}
.kc .r3{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc .age{margin-left:auto;font-size:11.5px;color:var(--text-3)}
.kc .age.late{color:var(--warn)}

/* ---------- fleet/map ---------- */
.fleet{display:grid;grid-template-columns:340px minmax(0,1fr);gap:0;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--s1);height:calc(100vh - 190px);min-height:560px}
.fleet-l{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.fleet-l .fh{padding:14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.fleet-l .fl{overflow-y:auto;flex:1}
.veh{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;align-items:center}
.veh:hover{background:var(--s2)}
.veh.on{background:var(--s2);box-shadow:inset 3px 0 0 var(--red)}
.veh .st{width:9px;height:9px;border-radius:50%;flex:none}
.veh .t{flex:1;min-width:0}
.veh .t b{font-weight:500;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.veh .t span{font-size:12px;color:var(--text-3)}
.veh .spd{font-family:var(--f-mono);font-size:12px;color:var(--text-2);text-align:right}
.map{position:relative;background:#16171A;min-width:0;overflow:hidden}
.map svg.base{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--s1);border:2px solid var(--text-2);cursor:pointer;transition:transform .15s;z-index:2}
.pin svg{width:13px;height:13px}
.pin:hover,.pin.on{transform:translate(-50%,-50%) scale(1.18);z-index:4}
.pin.moving{border-color:var(--ok);color:var(--ok)}
.pin.idle{border-color:var(--text-3);color:var(--text-2)}
.pin.alert{border-color:var(--err);color:var(--err);box-shadow:0 0 0 5px var(--err-t)}
.pin.on{background:var(--red);border-color:#fff;color:#fff}
.map-card{position:absolute;right:16px;top:16px;width:320px;max-width:calc(100% - 32px);background:#1A1B1Df2;backdrop-filter:blur(10px);border:1px solid var(--border-2);border-radius:var(--r-lg);padding:16px;z-index:5;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 32px);overflow-y:auto}
.map-legend{position:absolute;left:16px;bottom:16px;display:flex;gap:12px;background:#1A1B1De6;border:1px solid var(--border);border-radius:9px;padding:7px 11px;font-size:11.5px;color:var(--text-2);z-index:3;flex-wrap:wrap}
.map-legend span{display:flex;align-items:center;gap:6px}
.map-legend i{width:8px;height:8px;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--s2);border-radius:9px;padding:9px 10px}
.stat span{font-size:11px;color:var(--text-3);display:block}
.stat b{font-family:var(--f-disp);font-weight:600;font-size:16px}

/* ---------- profile ---------- */
.prof-h{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prof-h .t h1{font-size:28px}
.prof-h .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--text-2)}
.prof-h .meta span{display:flex;align-items:center;gap:5px}
.prof-h .meta svg{width:14px;height:14px;color:var(--text-3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{padding:10px 12px;font-size:13.5px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--red)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.kv div span{display:block;font-size:11.5px;color:var(--text-3);margin-bottom:2px}
.kv div b{font-weight:500;font-size:13.5px}
.sec-t{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px;font-weight:500}
.report-cat{display:grid;grid-template-columns:minmax(0,1fr) 150px 44px;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
.report-cat:last-child{border-bottom:0}
.report-cat b{font-weight:500;display:block}
.report-cat span{font-size:12px;color:var(--text-3)}
.report-cat .sc{font-family:var(--f-disp);font-weight:600;font-size:17px;text-align:right}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.check:last-child{border-bottom:0}
.check .res{margin-left:auto}
.check svg{width:16px;height:16px;flex:none}
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:16px 1fr;gap:12px;position:relative;padding-bottom:16px}
.tl-i::before{content:"";position:absolute;left:7px;top:14px;bottom:0;width:1px;background:var(--border)}
.tl-i:last-child::before{display:none}
.tl-i i{width:15px;height:15px;border-radius:50%;border:2px solid var(--border-2);background:var(--s1);margin-top:2px}
.tl-i.done i{background:var(--ok);border-color:var(--ok)}
.tl-i.now i{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px var(--red-t2)}
.tl-i b{font-weight:500;display:block;font-size:13.5px}
.tl-i span{font-size:12px;color:var(--text-3)}
.doc{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--s2)}
.doc .th{width:42px;height:42px;border-radius:8px;background:var(--s3);display:grid;place-items:center;color:var(--text-3);flex:none}
.doc .th svg{width:18px;height:18px}
.doc .t{flex:1;min-width:0}
.doc .t b{font-weight:500;font-size:13px;display:block}
.doc .t span{font-size:12px;color:var(--text-3)}
.sig{height:84px;border:1px dashed var(--border-2);border-radius:10px;display:grid;place-items:center;background:var(--s2)}
.ssn{font-family:var(--f-mono);letter-spacing:.06em}
.note-box{display:flex;flex-direction:column;gap:10px}
.note-box textarea{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:74px;resize:vertical;outline:0}
.note-box textarea:focus{border-color:var(--border-2)}
.note{background:var(--s2);border-radius:10px;padding:11px 12px;font-size:13px}
.note .by{font-size:11.5px;color:var(--text-3);margin-bottom:4px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:56px repeat(5,minmax(130px,1fr));overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--s1)}
.cal .ch{padding:12px 10px;border-bottom:1px solid var(--border);border-left:1px solid var(--border);font-size:12.5px;position:sticky;top:0;background:var(--s1)}
.cal .ch b{font-family:var(--f-disp);font-size:20px;font-weight:600;display:block;line-height:1.1}
.cal .ch.today b{color:var(--red)}
.cal .hr{font-size:11px;color:var(--text-3);padding:4px 8px;text-align:right;height:56px;border-bottom:1px solid var(--border)}
.cal .cell{border-left:1px solid var(--border);border-bottom:1px solid var(--border);height:56px;position:relative}
.ev{position:absolute;left:4px;right:4px;border-radius:7px;padding:5px 8px;font-size:11.5px;line-height:1.3;overflow:hidden;background:var(--s3);border-left:3px solid var(--text-2)}
.ev b{font-weight:500;display:block;color:var(--text)}
.ev span{color:var(--text-2)}
.ev.red{background:var(--red-t2);border-left-color:var(--red)}
.ev.gold{background:var(--gold-t);border-left-color:var(--gold)}
.ev.info{background:var(--info-t);border-left-color:var(--info)}

/* ---------- integrations ---------- */
.intg{padding:16px;display:flex;flex-direction:column;gap:12px}
.intg .ih{display:flex;align-items:center;gap:12px}
.intg .lg{width:40px;height:40px;border-radius:10px;background:var(--s3);display:grid;place-items:center;color:var(--text)}
.intg .lg svg{width:20px;height:20px}
.intg .ih b{font-weight:500;display:block}
.intg .ih span{font-size:12px;color:var(--text-3)}
.intg p{font-size:12.5px;color:var(--text-2)}
.intg .if{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:8px}
.tog{width:36px;height:21px;border-radius:21px;background:var(--s3);position:relative;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--text-2);transition:transform .2s,background .2s}
.tog.on{background:var(--red)}
.tog.on::after{transform:translateX(15px);background:#fff}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--text-2)}
.inp{background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;outline:0;width:100%}
.inp:focus{border-color:var(--border-2);box-shadow:0 0 0 3px #ffffff08}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.swatches{display:flex;gap:8px}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid transparent}
.sw.on{border-color:#fff}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login-l{padding:48px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.login-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px}
.login-r{background:var(--s1);border-left:1px solid var(--border);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:48px}
.login-r h2{font-size:38px;line-height:1.05;max-width:14ch;position:relative}
.login-r p{color:var(--text-2);margin-top:12px;max-width:44ch;position:relative}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--s3);border:1px solid var(--border-2);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;z-index:100;pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:16px;height:16px;color:var(--ok)}

.fade{animation:fade .35s ease both}
@keyframes fade{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.chart text{fill:var(--text-3);font-size:11px;font-family:var(--f-ui)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px}

.scrim{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brief{grid-template-columns:1fr}
  .g-main,.g-main-r{grid-template-columns:1fr}
  .g-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:264px;z-index:60;transform:translateX(-100%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:#0009;z-index:55}
  .menu-btn{display:grid}
  .top{padding:10px 16px}
  .view{padding:20px 16px 60px}
  .fleet{grid-template-columns:1fr;height:auto}
  .fleet-l{border-right:0;border-bottom:1px solid var(--border);max-height:320px}
  .map{height:520px}
  .login{grid-template-columns:1fr}
  .login-r{display:none}
  .live{display:none}
}
@media (max-width:620px){
  .g-4,.g-3,.g-2{grid-template-columns:1fr}
  .g-4.keep{grid-template-columns:repeat(2,minmax(0,1fr))}
  .head h1{font-size:25px}
  .kv{grid-template-columns:1fr}
  .report-cat{grid-template-columns:minmax(0,1fr) 44px}
  .report-cat .bar{display:none}
  .search kbd{display:none}
  .kpi .val{font-size:25px}
  .map-card{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:60%}
  .map-legend{display:none}
}

/* ================= v2 theme: front-end button + type language on white ================= */
:root{--f-tech:"Saira","Geist",ui-sans-serif,system-ui,sans-serif;--f-title:"Chakra Petch","Saira",sans-serif}
.btn{border-radius:2px!important;font-family:var(--f-tech);font-weight:700;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;height:38px;padding:0 16px;border:1.5px solid var(--ink)!important;background:#fff!important;color:var(--ink)!important;box-shadow:none!important;transition:background .2s,color .2s,border-color .2s,box-shadow .2s}
.btn:hover{background:var(--ink)!important;color:#fff!important}
.btn svg{transition:transform .2s}.btn:hover svg{transform:translateX(2px)}
.btn.pri{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
.btn.pri:hover{background:#B81F24!important;border-color:#B81F24!important;box-shadow:0 10px 24px -12px #D7262Bcc!important}
.btn.ghost{border-color:transparent!important;background:none!important;color:var(--text-2)!important}
.btn.ghost:hover{color:var(--ink)!important;background:var(--s2)!important}
.btn.sm{height:30px;padding:0 11px;font-size:10.5px;letter-spacing:.1em}
.btn.round{border-radius:2px!important}
.ov-head h1{font-family:var(--f-title)!important;text-transform:uppercase;letter-spacing:.005em!important;font-weight:700!important}
.eb{font-family:var(--f-tech);font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.eb::before{width:2px!important;height:11px!important;background:var(--red)!important;opacity:1!important}
.seg{border-radius:2px!important;padding:3px!important}
.seg button{border-radius:1px!important;font-family:var(--f-tech);font-weight:600;font-size:11px!important;letter-spacing:.1em;text-transform:uppercase}
.seg button.on{background:var(--ink)!important;color:#fff!important;box-shadow:none!important}
.chip{border-radius:2px!important;font-family:var(--f-tech);font-weight:600;font-size:11px!important;letter-spacing:.1em;text-transform:uppercase}
.chip.on{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
.card{border-radius:6px!important}
.inp,.search{border-radius:2px!important}

/* ================= pipeline v3 ================= */
.pv-head{align-items:flex-end}
.pv-funnel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--border);background:#fff;margin-top:6px}
.pv-f{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px 18px 14px;text-align:left;background:none;border:0;cursor:pointer;transition:background .2s}
.pv-f+.pv-f{border-left:1px solid var(--border)}
.pv-f::after{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.pv-f:hover{background:var(--s2)}
.pv-f.on{background:#fafaf9}.pv-f.on::after{transform:none}
.pv-fl{display:flex;align-items:center;gap:7px;font-family:var(--f-tech);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);white-space:nowrap}
.pv-fl i{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.pv-fl i.st-info{background:var(--info)}.pv-fl i.st-warn{background:var(--warn)}.pv-fl i.st-gold{background:#C8A24A}.pv-fl i.st-ok{background:var(--ok)}.pv-fl i.st-n{background:var(--red)}
.pv-f b{font-family:var(--f-title);font-size:28px;line-height:1;color:var(--ink)}
.pv-f small{font-family:var(--f-mono);font-size:11px;color:var(--text-3)}
.pv-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 16px}
.pv-q{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1.5px solid var(--border-2);background:#fff;flex:1 1 240px;max-width:340px;transition:border-color .2s}
.pv-q:focus-within{border-color:var(--ink)}
.pv-q svg{width:15px;height:15px;color:var(--text-3)}
.pv-q input{border:0;outline:0;flex:1;font:inherit;font-size:13.5px;background:none;min-width:0}
.pv-late{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;background:#D7262B12;color:var(--red);font-family:var(--f-tech);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.pv-late svg{width:13px;height:13px}
.pv-view{margin-left:auto}
.pv-board{display:grid;grid-template-columns:repeat(var(--n),minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px;align-items:start}
.pv-col{background:#F6F6F4;border:1px solid var(--border);min-height:200px;transition:background .2s,border-color .2s}
.pv-col.drop{background:#D7262B0d;border-color:var(--red)}
.pv-col header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0}
.pv-col header b{font-family:var(--f-title);font-size:15px}
.pv-cb{display:flex;flex-direction:column;gap:10px;padding:10px}
.pv-empty{border:1.5px dashed var(--border-2);padding:22px;text-align:center;font-size:12.5px;color:var(--text-3)}
.pc{background:#fff;border:1px solid var(--border);padding:14px;cursor:pointer;position:relative;transition:border-color .2s,box-shadow .25s,transform .25s}
.pc::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:transparent}
.pc.late::before{background:var(--red)}
.pc:hover{border-color:var(--border-2);box-shadow:0 14px 30px -18px #18181a55;transform:translateY(-2px)}
.pc.drag{opacity:.45}
.pc-t{display:flex;align-items:center;gap:10px}
.pc-t .av{width:34px;height:34px;font-size:12px;flex:none}
.pc-n{flex:1;min-width:0;display:flex;flex-direction:column}
.pc-n b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-n span{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-m{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.pc-pay{font-family:var(--f-title);font-size:18px}.pc-pay small{font-family:var(--f-mono);font-size:11px;color:var(--text-3);margin-left:2px}
.pc-age{font-family:var(--f-mono);font-size:11px;color:var(--text-3)}
.pc.late .pc-age{color:var(--red)}
.pc-docs{display:flex;align-items:center;gap:8px;margin-top:10px}
.pc-docs i{flex:1;height:4px;background:var(--s3);overflow:hidden}.pc-docs u{display:block;height:100%;background:var(--ink)}
.pc-docs span{font-family:var(--f-mono);font-size:10.5px;color:var(--text-3)}
.pc-nx{display:flex;align-items:center;gap:7px;margin-top:12px;padding-top:11px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-2)}
.pc-nx>svg{width:14px;height:14px;color:var(--text-3);flex:none}
.pc-nx.warn,.pc-nx.warn>svg{color:var(--red)}
.pc-nx>span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-adv{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border:1.5px solid var(--ink);background:#fff;font-family:var(--f-tech);font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);cursor:pointer;opacity:0;transform:translateX(4px);transition:opacity .2s,transform .2s,background .2s,color .2s;white-space:nowrap}
.pc-adv svg{width:11px;height:11px}
.pc:hover .pc-adv,.pc:focus-within .pc-adv{opacity:1;transform:none}
.pc-adv:hover{background:var(--red);border-color:var(--red);color:#fff}
@media (hover:none){.pc-adv{opacity:1;transform:none}}
.pv-who{display:flex;align-items:center;gap:10px}.pv-who b{display:block;font-weight:600}
.pv-w{color:var(--red)}
@media (max-width:900px){.pv-funnel{grid-template-columns:repeat(3,1fr)}.pv-f:nth-child(4){border-left:0}.pv-f:nth-child(n+4){border-top:1px solid var(--border)}}

.pv-board{grid-template-columns:repeat(var(--n),minmax(200px,1fr))!important;gap:10px}
.pv-fl{font-size:9.5px;letter-spacing:.1em;white-space:normal;line-height:1.2}
.pv-f{padding:14px 14px 12px}
.pc{padding:12px}
.pc-t .grade{display:none}
.pc-nx{position:relative}
.pc-nx>span{white-space:normal}
.pc-adv{position:absolute;right:0;top:8px;height:28px;box-shadow:-14px 0 12px -2px #fff;background:#fff}
.pv-col header .pill{font-size:11px}

.pv-board{grid-template-columns:repeat(var(--n),minmax(176px,1fr))!important}
.pv-list .tbl{table-layout:auto!important;width:100%}
.pv-list .tbl td:last-child{white-space:nowrap;width:1%}
.pv-list .mono.dim{display:block;font-family:inherit;font-size:12px}

.pv-list .tbl td,.pv-list .tbl th{padding-left:12px;padding-right:12px}
.pv-list .tbl td:first-child{white-space:normal;max-width:240px}
.pv-list .tbl td:nth-child(3){white-space:normal}

/* ===== owner card v2 ===== */
.who-card.wc2{position:relative;display:flex;align-items:center;gap:11px;padding:12px;border:0;border-radius:4px;background:#0E0E10;color:#fff;overflow:hidden;box-shadow:0 12px 26px -16px #000c}
.who-card.wc2::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 120% at 100% 0%,#D7262B33,transparent 60%);pointer-events:none}
.wc2-av{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#2a2a2d,#161618);font-family:var(--f-title);font-size:15px;color:#fff;box-shadow:0 0 0 1.5px #D7262B,0 0 0 4px #0E0E10;flex:none}

.wc2-t{min-width:0;flex:1;position:relative}
.wc2-t b{display:block;font-family:var(--f-tech);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0}
.wc2-t span{display:block;font-size:11px;color:#ffffff80;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc2-role{position:relative;font-family:var(--f-tech);font-weight:700;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--red);padding:4px 7px;flex:none}

/* ===== settings v2: premium, on brand ===== */
.mset.ms2{grid-template-columns:260px minmax(0,1fr);border-radius:6px;min-height:680px;box-shadow:0 1px 2px #1414140a,0 30px 70px -40px #1414144d}
.ms2 .ms-side{background:#0E0E10;border-right:0;padding:26px 14px;gap:0;position:relative;overflow:hidden}
.ms2 .ms-side::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 0% 100%,#D7262B26,transparent 60%);pointer-events:none}
.ms2-brand{position:relative;padding:0 10px 22px;margin-bottom:14px;border-bottom:1px solid #ffffff14}
.ms2-brand .eb{color:#ffffff73}
.ms2-brand b{display:block;margin-top:8px;font-family:var(--f-title);font-size:22px;text-transform:uppercase;color:#fff;letter-spacing:.02em}
.ms2 .ms-search{position:relative;margin:0 0 14px;padding:9px 12px;border-radius:2px;background:#ffffff0d;border:1px solid #ffffff14;color:#ffffff80}
.ms2 .ms-search input{color:#fff}
.ms2 .ms-grp{height:0;margin:10px 10px;border-top:1px solid #ffffff12}

.ms2 .ms-item:hover{background:#ffffff0a;color:#fff}
.ms2 .ms-item.on{background:#ffffff12;color:#fff}
.ms2 .ms-item::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--red);transform:scaleY(0);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.ms2 .ms-item.on::before{transform:none}
.ms2 .ms-item .ms-ic{background:none!important;box-shadow:none;width:18px;height:18px;color:#ffffff80}
.ms2 .ms-item.on .ms-ic{color:var(--red)}
.ms2 .ms-ic svg{width:16px;height:16px;stroke-width:1.7}
.ms2 .ms-top{padding:18px 36px;justify-content:space-between;font-weight:500}
.ms2-crumb{font-family:var(--f-tech);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}
.ms2-crumb i{font-style:normal;margin:0 10px;color:var(--border-2)}.ms2-crumb b{color:var(--ink);font-weight:700}
.ms2-save{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}.ms2-save svg{width:13px;height:13px;color:#34C759}
.ms2 .ms-body{padding:34px 36px 44px;gap:30px;max-width:860px}
.ms2 .ms-hero{flex-direction:row;align-items:center;text-align:left;gap:18px;padding:0 0 26px;border-bottom:1px solid var(--border)}
.ms2 .ms-hero .ms-ic{width:56px;height:56px;border-radius:2px;background:#0E0E10!important;color:#fff;box-shadow:inset 0 0 0 1px #ffffff14,0 12px 24px -14px #000a;position:relative}
.ms2 .ms-hero .ms-ic::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--red)}
.ms2 .ms-hero .ms-ic svg{width:24px;height:24px;stroke-width:1.6}
.ms2 .ms-hero b{display:block;font-family:var(--f-title);font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.ms2 .ms-hero span{display:block;margin-top:8px;font-size:14px;color:var(--text-2)}
.ms2 .ms-sec{gap:10px}
.ms2 .ms-sec>h5{margin:0;display:flex;align-items:center;gap:8px;font-family:var(--f-tech);font-weight:600;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3)}
.ms2 .ms-sec>h5::before{content:"";width:2px;height:11px;background:var(--red)}
.ms2 .ms-box{background:#fff;border:1px solid var(--border);border-radius:2px}
.ms2 .ms-row{min-height:58px;padding:12px 20px;font-size:14px;transition:background .2s}
.ms2 .ms-row:hover{background:#FAFAF9}
.ms2 .ms-row+.ms-row{border-top-color:#F0F0EE}
.ms2 .ms-row .l b{font-weight:600}.ms2 .ms-row .l span{font-size:12px}
.ms2 .ms-row .v{font-family:var(--f-mono);font-size:13px;color:var(--ink)}

@media (max-width:480px){.search{flex:0 0 auto;margin-inline:auto 0;width:34px;height:34px;padding:0;justify-content:center;border-radius:9px}.search span{display:none}.top{gap:10px}}
[hidden]{display:none!important}

/* ================= LIGHT BACK-OFFICE THEME (overrides everything above) ================= */
:root{
  color-scheme:light;
  --bg:#F4F4F2;--s1:#FFFFFF;--s2:#F7F7F5;--s3:#EEEEEB;--border:#E8E8E4;--border-2:#D8D8D3;
  --text:#18181A;--text-2:#65676C;--text-3:#9C9EA3;
  --red:#D7262B;--red-h:#C21F24;--red-t:#D7262B12;--red-t2:#D7262B1F;
  --gold:#A6843F;--gold-t:#B08D4E1A;
  --ok:#1E9E5E;--ok-t:#1E9E5E14;--warn:#C27C0E;--warn-t:#E0A33A1C;--err:#D93F3C;--err-t:#D93F3C14;--info:#2F74C0;--info-t:#2F74C014;
  --ink:#18181A;
  --hl:none;
  --lift:0 1px 2px #1818180a,0 10px 30px -18px #18181a1f;
}
body{background:var(--bg);color:var(--text);font-size:14px;letter-spacing:-.005em}
body::after{display:none}
::selection{background:#18181A;color:#fff}
*{scrollbar-color:#D5D5D0 transparent}

/* typography: Gilroy-style geometric, medium weights, near-black ink */
h1,h2,h3,h4{font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.head h1{font-size:32px;font-weight:600;letter-spacing:-.035em}
.head .sub{color:var(--text-2)}
.eyebrow{color:var(--text-3);font-weight:600;letter-spacing:.12em}
.kpi .val{font-weight:600;letter-spacing:-.04em;color:var(--ink)}
.kpi .val small{color:var(--text-3);font-weight:500}
.kpi .lbl{color:var(--text-2);font-weight:500}
.card-h h3{font-weight:600;letter-spacing:-.015em}
.brief h2{font-weight:600;letter-spacing:-.035em}
.score-row div b{font-weight:600;letter-spacing:-.04em;color:var(--ink)}
.mono{color:inherit}

/* surfaces */
.card{background:#FFFFFF;border-color:var(--border);box-shadow:var(--lift)}
.brief{background:radial-gradient(520px 240px at 0% 0%,#B08D4E14 0%,transparent 70%),#FFFFFF;border-color:var(--border);box-shadow:var(--lift)}
.brief::before{opacity:.35}
.act{background:var(--s2);border-color:var(--border);box-shadow:none}
.act:hover{border-color:var(--border-2);background:#fff;box-shadow:var(--lift)}
.chip{background:#fff;border-color:var(--border);color:var(--text-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on .dim{color:#ffffff99}
.stat{background:var(--s2);box-shadow:none}

/* sidebar + top bar */
.side{background:#FFFFFF;border-right-color:var(--border)}
.brand b{color:var(--ink)}
.brand-mark{background:var(--red);box-shadow:0 6px 16px -8px #D7262B99}
.nav a{color:var(--text-2);font-weight:500}
.nav a:hover{background:var(--s2);color:var(--ink)}
.nav a.on{background:var(--ink);color:#fff;box-shadow:0 6px 16px -10px #18181a80}
.nav a.on svg{color:#fff}
.nav a .ct{background:var(--s3);color:var(--text-2)}
.nav a.on .ct{background:#ffffff26;color:#fff}
.side-foot{border-top-color:var(--border)}
.top{background:#F4F4F2d9;border-bottom-color:transparent}
.crumb b{color:var(--ink)}
.search{background:#fff;border-color:var(--border);box-shadow:0 1px 2px #1818180a;color:var(--text-3)}
.search:hover{border-color:var(--border-2)}
.search kbd,.pal kbd{background:var(--s2);border-color:var(--border);color:var(--text-3)}
.icon-btn{background:#fff;border-color:var(--border);box-shadow:0 1px 2px #1818180a;color:var(--text-2)}
.icon-btn .dot{box-shadow:0 0 0 2px #fff}
.av{background:var(--s3);color:var(--ink)}

/* buttons: black primary like the references, red kept for brand + alerts */
.btn{background:#fff;border-color:var(--border);color:var(--ink);box-shadow:0 1px 2px #1818180a}
.btn:hover{background:var(--s2);border-color:var(--border-2)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 8px 18px -10px #18181acc}
.btn.pri:hover{background:#2C2C2F;border-color:#2C2C2F}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--s3);color:var(--ink)}
.seg{background:var(--s3);border-color:transparent;box-shadow:none}
.seg button{color:var(--text-2);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #18181a1f}
.tog{background:#DADAD5}
.tog::after{background:#fff;box-shadow:0 1px 2px #0003}
.tog.on{background:var(--ink)}

/* pills + grades */
.pill{background:var(--s3);color:var(--text-2);border-color:transparent;font-weight:600}
.pill.red{background:var(--red-t);color:#B81E23;border-color:#D7262B26}
.pill.gold{color:#8A6C2E}
.grade{font-weight:700}

/* tables */
.tbl th{background:#FAFAF8;color:var(--text-3);font-weight:600}
.tbl td{border-bottom-color:#F0F0EC}
.tbl tbody tr.link:hover{background:#FAFAF8}
.bar{background:#EFEFEB}

/* kanban */
.col{background:#EDEDEA;border-color:transparent}
.col-h{border-bottom-color:#E2E2DE}
.col.drop .col-b{background:#18181A0d}
.kc{background:#fff;border-color:transparent;box-shadow:0 1px 2px #1818180f,0 6px 16px -12px #1818182e}
.kc:hover{border-color:var(--border-2)}

/* profile, docs, notes */
.tabs{border-bottom-color:var(--border)}
.tabs button{font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.doc{background:var(--s2);border-color:var(--border)}
.doc .th{background:#fff;border:1px solid var(--border)}
.sig{background:var(--s2);border-color:var(--border-2)}
.note{background:var(--s2)}
.note-box textarea,.inp{background:#fff;border-color:var(--border);color:var(--ink)}
.inp:focus,.note-box textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px #18181a0f}
.tl-i i{background:#fff;border-color:var(--border-2)}
.tl-i.now i{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 4px #18181a14}
.tl-i::before{background:var(--border)}
.intg .lg{background:var(--s2);border:1px solid var(--border);color:var(--ink)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}

/* calendar */
.cal{background:#fff;border-color:var(--border);box-shadow:var(--lift)}
.cal .ch{background:#fff;border-color:var(--border)}
.cal .hr,.cal .cell{border-color:#F0F0EC}
.ev{background:var(--s3);border-left-color:var(--text-3)}
.ev.red{background:#D7262B12}
.ev.gold{background:#B08D4E1A}
.ev.info{background:#2F74C014}

/* fleet map (light, like the Auto Ultimate map) */
.fleet{background:#fff;border-color:var(--border);box-shadow:var(--lift)}
.fleet-l{border-right-color:var(--border)}
.fleet-l .fh,.veh{border-bottom-color:#F0F0EC}
.veh:hover{background:var(--s2)}
.veh.on{background:var(--s2);box-shadow:inset 3px 0 0 var(--ink)}
.map{background:#ECECE8}
.base .rd{stroke:#F7F7F4;stroke-width:1.4}
.base .art{stroke:#FFFFFF;stroke-width:4}
.base .fwy{stroke:#FFFFFF;stroke-width:7}
.base .water{fill:#D6E2EC}
.base .lbl{fill:#A5A7AB}
.base .lbl.big{fill:#8E9095}
.base .rl{fill:#B4B6B9}
.base .off{fill:#8A6C2E}
.mp .dotc{fill:#fff;stroke:#9C9EA3;filter:drop-shadow(0 2px 3px #0000002e)}
.mp .core{fill:#65676C}
.mp.moving .dotc{stroke:#1E9E5E}.mp.moving .core{fill:#1E9E5E}
.mp.alert .halo{fill:#D93F3C24}.mp.alert .dotc{stroke:#D93F3C}.mp.alert .core{fill:#D93F3C}
.mp.on .dotc{fill:var(--ink);stroke:#fff}.mp.on .core{fill:#fff}.mp.on .halo{fill:#18181A1a}
.map-card{background:#FFFFFFf2;border-color:var(--border);box-shadow:0 20px 50px -20px #18181a40}
.map-legend{background:#FFFFFFe6;border-color:var(--border)}

/* charts */
.aend{box-shadow:0 0 0 3px #fff,0 0 0 7px #D7262B26}
.aline{background:linear-gradient(180deg,#18181a00,#18181a40,#18181a00)}
.atip{background:#18181A;border-color:#18181A;color:#fff;box-shadow:0 14px 30px -12px #18181a80}
.atip .dim{color:#ffffff80}
.atip div{color:#ffffffb3}
.atip div b{color:#fff}
.chart text{fill:var(--text-3)}

/* command bar */
.pal-scrim{background:#18181A33;backdrop-filter:blur(4px)}
.pal{background:#fff;border-color:var(--border);box-shadow:0 40px 90px -24px #18181a59}
.pal-in{border-bottom-color:var(--border)}
.pal-in input{color:var(--ink)}
.pal-i.on{background:var(--s2);box-shadow:none}
.pal-ic{background:var(--s3);color:var(--text-2)}
.pal-i.on .pal-ic{background:var(--ink);color:#fff}
.pal-foot{border-top-color:var(--border)}

/* login */
.login-r{background:#ECECE8;border-left-color:var(--border)}
.login-r h2{color:var(--ink)}

/* toast */
.toast{background:var(--ink);border-color:var(--ink);color:#fff}
.toast svg{color:#6EE0A2}
:focus-visible{outline-color:var(--ink)}

/* ================= CLEAN LAYOUT (RP Fuel–style) ================= */
:root{--bg:#F6F7F6;--border:#ECEDEB;--ink:#141414;--text-2:#5F6166;--text-3:#9A9CA0;--lift:0 1px 2px #1414140a}
body{background:var(--bg);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
.app{grid-template-columns:232px minmax(0,1fr)}
/* sidebar */
.side{background:#FBFBFA;border-right:1px solid var(--border);padding:0;gap:0}
.logo{display:flex;align-items:center;gap:10px;padding:22px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:16px;letter-spacing:-.02em;color:var(--ink)}
.logo .brand-mark{width:28px;height:28px;font-size:13px;box-shadow:none}
.side-search{display:flex;align-items:center;gap:8px;margin:14px 12px 0;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text-3);font-size:13px}
.side-search svg{width:14px;height:14px}
.side-search span{flex:1;text-align:left}
.side-search kbd{font-family:var(--f-mono);font-size:10px;color:var(--text-3)}
.nav{padding:4px 10px}
.nav .grp{font-size:10.5px;letter-spacing:.14em;font-weight:500;color:var(--text-3);padding:22px 10px 8px}
.nav a{padding:8px 12px;border-radius:8px;font-size:13.5px;color:var(--text-2);font-weight:400;gap:11px;position:relative}
.nav a svg{width:16px;height:16px;color:var(--text-3)}
.nav a:hover{background:#F1F2F0;color:var(--ink)}
.nav a.on{background:#D7262B0f;color:var(--red);box-shadow:none;font-weight:500}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--red)}
.nav a.on svg{color:var(--red)}
.nav a.ext{margin-top:14px;font-size:12.5px;color:var(--text-3)}
.side-foot{display:block;border-top:1px solid var(--border);padding:12px;margin-top:auto}
.who-card{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff}
.who-card b{display:block;font-weight:500;font-size:13px;margin-bottom:3px}
.who-card .pill{font-size:10.5px;padding:1px 7px}
.signout{display:flex;align-items:center;gap:10px;padding:12px 10px 2px;font-size:13px;color:var(--text-2)}
.signout svg{width:15px;height:15px}
/* hide old top bar pieces */
.top{display:none}
.main{position:relative}
.menu-btn{position:absolute;top:16px;left:16px;z-index:30}
/* page column */
.view{max-width:1100px;margin-inline:auto;padding:40px 40px 80px;gap:22px}
.eb{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:500}
.eb::before{content:"";width:14px;height:1px;background:currentColor;opacity:.7}
.eb svg{width:13px;height:13px}
.ov-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:6px}
.ov-head h1{font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1.05;margin-top:12px;color:var(--ink)}
.ov-head h1 em{font-style:italic;color:var(--red);font-weight:600}
.ov-head p.muted{margin-top:10px;font-size:14px}
.signed{display:flex;align-items:center;gap:10px;margin-top:16px}
.signed .pill{font-size:11px}
.btn.round{border-radius:999px;height:38px;padding:0 18px}
.btn.pri{background:var(--red);border-color:var(--red);box-shadow:0 6px 16px -8px #D7262B99}
.btn.pri:hover{background:#C21F24;border-color:#C21F24}
/* cards */
.card{border:1px solid var(--border);border-radius:14px;box-shadow:var(--lift)}
.kpi{padding:18px 18px 16px;gap:0}
.kh{display:flex;align-items:center;justify-content:space-between}
.kh svg{width:15px;height:15px;color:var(--text-3)}
.kpi .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);font-weight:500}
.kpi .val{font-size:34px;font-weight:300;letter-spacing:-.03em;margin-top:18px;line-height:1;color:var(--ink)}
.ks{font-size:11px;color:var(--text-3);margin-top:10px}
.chart-card{padding:22px 22px 18px}
.cc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.cc-h h3{font-size:18px;font-weight:500;letter-spacing:-.02em;margin-top:8px}
.cc-f{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-top:10px;margin-bottom:-8px}
.more{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--red);font-weight:500}
.more svg{width:13px;height:13px}
.rows .row{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.rows .row:last-child{border-bottom:0}
.rows .row .t{flex:1;min-width:0}
.rows .row b{display:block;font-weight:500;font-size:14px}
.rows .row .mono{font-size:11.5px;color:var(--text-3)}
.rows .row.done{opacity:.45}
.summary{padding:22px 24px}
.summary p{font-size:15px;line-height:1.7;color:var(--text-2);max-width:78ch}
.summary b{color:var(--ink);font-weight:500}
/* chart: calm, single line */
.achart .aend{width:8px;height:8px;box-shadow:0 0 0 3px #fff}
.aplot svg path[fill^="url"]{opacity:.55}
/* tables */
.tbl th{background:#fff;font-size:10.5px;letter-spacing:.14em;font-weight:500;padding:14px 18px;border-bottom-color:var(--border)}
.tbl td{padding:14px 18px;border-bottom-color:#F2F3F1}
.stage{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2)}
.stage i{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.stage .st-ok{background:var(--ok)}.stage .st-warn{background:var(--warn)}.stage .st-info{background:var(--info)}.stage .st-gold{background:var(--gold)}
.grade{width:24px;height:24px;font-size:11.5px;border-radius:6px;box-shadow:none}
.chip{border-radius:999px;font-size:12.5px;padding:5px 12px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{background:#fff;border:1px solid var(--border);border-radius:999px;padding:8px 14px;cursor:text;margin:0}
/* kanban */
.kanban{grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px}
.col{background:transparent;border:0;min-height:0}
.col-h{border:0;padding:4px 4px 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);font-weight:500}
.col-h .n{margin-left:auto;color:var(--text-3)}
.col-b{padding:0;gap:8px}
.kc{border:1px solid var(--border);box-shadow:var(--lift);padding:14px;gap:6px;border-radius:12px}
.kc .r1{justify-content:space-between}
.kc .r1 b{font-size:13.5px}
.kc .car{font-size:12.5px;color:var(--text-3)}
.kc .r3{justify-content:space-between;font-size:11px;color:var(--text-2);margin-top:4px}
.kc .age{margin:0}
/* profile/fleet heads keep their structure but calmer */
.head h1{font-size:34px;font-weight:600;letter-spacing:-.035em}
.prof-h .t h1{font-size:30px;letter-spacing:-.035em}
.brief{box-shadow:var(--lift)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .view{padding:64px 16px 64px}
  .ov-head h1{font-size:32px}
  .side{width:260px}
}
@media (max-width:620px){.kpi .val{font-size:28px}.rows .row{flex-wrap:wrap}.rows .row .t{flex-basis:100%}}
.kanban{grid-template-columns:repeat(5,minmax(176px,1fr))}
.signed{flex-wrap:wrap}
.fleet{height:calc(100vh - 230px)}
/* ================= RP-style pages ================= */
.ov-head h1{font-weight:700;letter-spacing:-.045em}
.head h1{font-size:40px;font-weight:700;letter-spacing:-.045em}
.count{font-size:11px;background:#1E9E5E14;color:var(--ok);border-radius:999px;padding:2px 9px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid var(--border);color:var(--text-2);gap:7px;padding:6px 14px;font-size:13px}
.chip .dim{font-size:11.5px}
.chip.on{background:#D7262B0d;border-color:#D7262B59;color:var(--red);font-weight:500}
.chip.on .dim{color:#D7262B99}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:#F1F2F0;color:var(--text-2);border:1px solid #E6E7E4;white-space:nowrap}
.tag i{width:3px;height:11px;border-radius:2px}
.tag.ok{background:#1E9E5E12;color:#16804B;border-color:#1E9E5E2e}
.tag.warn{background:#E0A33A17;color:#9A6208;border-color:#E0A33A40}
.tag.red{background:#D7262B0f;color:#B81E23;border-color:#D7262B33}
.tag.info{background:#2F74C012;color:#2A64A6;border-color:#2F74C02e}
/* inventory directory */
.dir{gap:18px}
.vcard{overflow:hidden;padding:0;display:flex;flex-direction:column}
.vimg{position:relative;height:150px;background:linear-gradient(160deg,#F1F2F0,#E4E6E3);display:grid;place-items:center;border-bottom:1px solid var(--border)}
.car-art{width:74%;max-width:250px}
.car-art path{fill:#D5D8D4}.car-art .win{fill:#EEF0EE}.car-art .wh{fill:#55585B}.car-art .hub{fill:#B9BCB9}.car-art .shadow{fill:#0000001a}
.badge{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:7px;background:#fff;border-radius:999px;padding:4px 11px 4px 4px;font-size:12px;font-weight:600;letter-spacing:-.01em;box-shadow:0 2px 8px -2px #0000001f}
.badge .brand-mark{width:20px;height:20px;font-size:10px;box-shadow:none}
.vtype{position:absolute;right:12px;top:12px;font-size:11px;font-weight:500;background:#ffffffd9;border-radius:999px;padding:3px 10px;color:var(--text-2)}
.vtype.lease{color:var(--red)}
.vb{padding:18px 20px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.vk{font-size:10.5px;color:var(--text-3);letter-spacing:.06em}
.vb h3{font-size:16px;font-weight:600;letter-spacing:-.02em;margin:2px 0 4px}
.vl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3)}
.vl svg{width:14px;height:14px}
.vf{display:flex;align-items:center;gap:6px;border-top:1px solid var(--border);padding-top:14px;margin-top:auto}
.vf .btn{margin-left:auto;color:var(--ok);height:30px}
.vf .btn svg{width:13px;height:13px}
/* analytics */
.fbar{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap}
.fbar select.inp{width:auto;min-width:170px;border-radius:999px;font-weight:500}
.fbar .seg{border-radius:999px;padding:3px}
.fbar .seg button{border-radius:999px;padding:5px 14px}
.fbar .date{width:auto;border-radius:10px;font-family:var(--f-mono);font-size:13px;padding:7px 10px}
.vsep{width:1px;height:24px;background:var(--border)}
.fic{width:16px;height:16px;color:var(--text-3)}
.g-6{grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.tile{padding:18px;display:flex;flex-direction:column;gap:3px}
.tq{width:40px;height:40px;border-radius:11px;background:#F4F5F3;border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2);margin-bottom:12px}
.tq svg{width:17px;height:17px}

.vimg.sm{height:110px}

button.more{background:none;border:0;cursor:pointer;font:inherit;font-size:12.5px}

.ph-g{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--text-2)}

.st.done{color:var(--text-2)}.st.done i{background:var(--ok);color:#fff}.st.done::before{background:var(--ok)}
.st.now{color:var(--ink);font-weight:500}.st.now i{background:var(--ink);color:#fff;box-shadow:0 0 0 4px #18181a14}.st.now::before{background:var(--ok)}
.pill-tabs{border:0;background:#EEEFED;border-radius:999px;padding:4px;display:inline-flex;align-self:flex-start;gap:2px;max-width:100%}

.note-box{display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.phero{grid-template-columns:1fr}.rz{grid-template-columns:1fr;justify-items:center}.catlist{width:100%}}
@media (max-width:620px){.stepper span{font-size:10px}.ph-n h1{font-size:26px}.ph-l{flex-direction:column}.car-track{grid-auto-columns:100%!important}.prod{grid-template-columns:1fr}.payhist{grid-template-columns:repeat(6,1fr)}.vt b.num{font-size:23px}}

/* ===== Apple Maps look ===== */
.map{background:#F4F1EA!important}
.base .park{fill:#CDE7C3;stroke:#BFDDB3;stroke-width:1}
.base .water{fill:#A6D3F2!important}
.base .rd{stroke:#FFFFFF!important;stroke-width:2!important;opacity:.95}
.base .art-c{fill:none;stroke:#E2DDD2;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.base .art{stroke:#FFFFFF!important;stroke-width:5!important;stroke-linecap:round}
.base .fwy-c{fill:none;stroke:#E8AE3F;stroke-width:10;stroke-linejoin:round;stroke-linecap:round}
.base .fwy{stroke:#FBD36B!important;stroke-width:7!important}
.base .lbl{fill:#6E6A63!important;font:600 11px -apple-system,"SF Pro Text","Helvetica Neue",var(--f-ui)!important;letter-spacing:.06em!important;paint-order:stroke;stroke:#F4F1EA;stroke-width:3.5px;stroke-linejoin:round}
.base .lbl.big{fill:#3A3835!important;font-size:14px!important;font-weight:700!important;letter-spacing:.02em!important}
.base .rl{fill:#8A7440!important;font:600 9.5px -apple-system,"SF Pro Text","Helvetica Neue",var(--f-ui)!important;letter-spacing:.02em!important;paint-order:stroke;stroke:#FBD36B;stroke-width:0;}
.base .off{fill:#1A1916!important;font:700 11.5px -apple-system,"SF Pro Text","Helvetica Neue",var(--f-ui)!important;paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}
.opin{filter:drop-shadow(0 3px 4px #0004)}
.mp .dotc{fill:#8E8E93!important;stroke:#fff!important;stroke-width:3!important;filter:drop-shadow(0 2px 4px #0003)}
.mp .core{fill:#fff!important}
.mp.moving .dotc{fill:#34C759!important}
.mp.alert .dotc{fill:#FF3B30!important}.mp.alert .halo{fill:#FF3B3026!important;animation:apPulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.mp.on .dotc{fill:#007AFF!important;stroke:#fff!important}.mp.on .halo{fill:#007AFF26!important;r:24}
@keyframes apPulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
.map-legend{background:#FFFFFFd9!important;backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);border:0!important;border-radius:12px!important;box-shadow:0 4px 16px #0000001f;color:#3A3835!important}

/* ===== map motion: SMIL pulse rings, camera fly-to, constant-size pins ===== */
.mp .halo{display:none}
.mp .ring{fill:none;stroke-width:2.5;pointer-events:none}
.mp.moving .ring{stroke:#34C759}.mp.alert .ring{stroke:#FF3B30}.mp.on .ring{stroke:#007AFF}
.mp .dotc{transition:none!important}
.mp:hover .dotc,.mp:focus-visible .dotc{r:11.5}
.mp.on .dotc{r:12.5}
#map svg.base .mp{transition:transform 1.95s linear}
#map svg.base .lbl{font-size:calc(11px * var(--k,1))!important;stroke-width:calc(3.5px * var(--k,1))}
#map svg.base .lbl.big{font-size:calc(14px * var(--k,1))!important}
#map svg.base .rl{font-size:calc(9.5px * var(--k,1))!important}
#map svg.base .opin,#map svg.base .off{transform:scale(var(--k,1))}
#map .map-card{animation:mcIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes mcIn{from{opacity:0;transform:translateY(8px) scale(.985)}}
.veh{transition:background-color .25s,box-shadow .25s}

.view{gap:24px}

.pay-sum span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);font-weight:500}

/* ===== attention pop-up ===== */
.view{padding-top:84px!important}
html{scrollbar-width:none}html::-webkit-scrollbar{width:0;height:0}

.attn>*{flex-shrink:0}
.attn-btn{pointer-events:auto;display:inline-flex;align-items:center;gap:12px;height:44px;padding:0 8px 0 18px;border-radius:12px;background:#141414;color:#fff;font-size:13.5px;font-weight:500;letter-spacing:-.01em;box-shadow:0 14px 34px -14px #14141499,0 2px 6px #14141426;transform:translateY(-70px);opacity:0;transition:transform .7s cubic-bezier(.2,.9,.25,1.1),opacity .5s,background .2s}
.attn.in .attn-btn{transform:none;opacity:1}
.attn-btn:hover{background:#262626}
.attn-dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--red)}
.attn-dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--red);animation:attnP 1.8s ease-out infinite}
@keyframes attnP{from{transform:scale(.5);opacity:1}to{transform:scale(1.5);opacity:0}}
.attn-n{min-width:28px;height:28px;padding:0 8px;border-radius:8px;background:#ffffff1a;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.attn-btn svg{width:14px;height:14px;transition:transform .35s}
.attn.open .attn-btn svg{transform:rotate(90deg)}
.attn-panel{pointer-events:auto;width:min(760px,calc(100% - 32px));margin-top:10px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 30px 70px -28px #1414144d,0 2px 8px #1414140f;overflow:hidden;transform-origin:top center;transform:translateY(-8px) scale(.98);opacity:0;visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility 0s .35s}
.attn.open .attn-panel{transform:none;opacity:1;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.attn-h{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
.attn-h .eb{margin:0}
.attn-h button{font-size:12.5px;color:var(--text-3)}.attn-h button:hover{color:var(--ink)}
.attn-panel .row{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);transition:opacity .3s,background .2s}
.attn-panel .row:last-child{border-bottom:0}
.attn-panel .row:hover{background:#FAFAF9}
.attn-panel .row .t{flex:1;min-width:0}.attn-panel .row b{display:block;font-weight:500;font-size:14px}
.attn-panel .row .mono{font-size:11.5px;color:var(--text-3)}
.attn-panel .row.done{opacity:.4}
.attn.clear .attn-dot{background:var(--ok)}.attn.clear .attn-dot::after{display:none}
@media (max-width:620px){.attn{top:64px}.attn-btn{font-size:12.5px;gap:9px;padding-left:14px}.attn-panel .row{flex-wrap:wrap}.attn-panel .row .t{flex-basis:100%}}

/* ===== macOS System Settings style ===== */
.mset{display:grid;grid-template-columns:240px minmax(0,1fr);background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;min-height:640px;box-shadow:0 1px 2px #1414140a,0 24px 60px -34px #14141433}
.ms-side{background:#F5F5F4;border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.ms-lights{display:flex;gap:8px;padding:4px 8px 14px}.ms-lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57}.ms-lights i:nth-child(2){background:#FEBC2E}.ms-lights i:nth-child(3){background:#28C840}
.ms-search{display:flex;align-items:center;gap:6px;margin:0 4px 10px;padding:6px 9px;border-radius:7px;background:#E8E8E6;color:var(--text-3);font-size:13px}
.ms-search svg{width:13px;height:13px}.ms-search input{border:0;background:none;outline:0;min-width:0;flex:1;font-size:13px}
.ms-me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;margin-bottom:8px}
.ms-me b{display:block;font-size:13px;font-weight:600}.ms-me span{font-size:11.5px;color:var(--text-3)}
.ms-grp{height:10px}
.ms-item{display:flex;align-items:center;gap:9px;width:100%;padding:5px 8px;border-radius:7px;font-size:13px;color:var(--ink);text-align:left}
.ms-item:hover{background:#EAEAE8}
.ms-item.on{background:#0A64D8;color:#fff}
.ms-ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:inset 0 0 0 .5px #0000001a}
.ms-ic svg{width:13px;height:13px;stroke-width:2}
.ms-main{padding:0;min-width:0;display:flex;flex-direction:column}
.ms-top{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.ms-top .nav2{display:flex;gap:4px;color:var(--text-3)}.ms-top .nav2 svg{width:15px;height:15px}
.ms-body{padding:22px 26px 34px;display:flex;flex-direction:column;gap:22px;animation:msIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes msIn{from{opacity:0;transform:translateY(4px)}}
.ms-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px 0 4px}
.ms-hero .ms-ic{width:54px;height:54px;border-radius:14px}.ms-hero .ms-ic svg{width:28px;height:28px}
.ms-hero b{font-size:17px;font-weight:600}.ms-hero span{font-size:12.5px;color:var(--text-2);max-width:52ch}
.ms-sec{display:flex;flex-direction:column;gap:6px}
.ms-sec>h5{margin:0 0 0 12px;font-size:12px;font-weight:600;color:var(--text-2)}
.ms-box{background:#F7F7F6;border:1px solid #EBEBE8;border-radius:10px;overflow:hidden}
.ms-row{display:flex;align-items:center;gap:12px;min-height:44px;padding:9px 14px;font-size:13px}
.ms-row+.ms-row{border-top:1px solid #E8E8E5}
.ms-row .l{flex:1;min-width:0}.ms-row .l b{display:block;font-weight:500}.ms-row .l span{display:block;font-size:11.5px;color:var(--text-3);margin-top:2px}
.ms-row .v{color:var(--text-2);display:flex;align-items:center;gap:6px}
.ms-row input.ms-in{border:0;background:none;text-align:right;outline:0;color:var(--text-2);font-size:13px;min-width:0;width:220px}
.ms-row input.ms-in:focus{color:var(--ink)}
.ms-note{font-size:11.5px;color:var(--text-3);margin:2px 12px 0}
.mtog{width:38px;height:22px;border-radius:22px;background:#E0E0DC;position:relative;transition:background .25s;flex:none}
.mtog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003,0 0 0 .5px #0000000d;transition:transform .25s cubic-bezier(.3,.7,.3,1.2)}
.mtog.on{background:#34C759}.mtog.on::after{transform:translateX(16px)}
.mpop{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 10px;border-radius:6px;background:#fff;border:1px solid #E2E2DF;box-shadow:0 1px 1px #0000000a;font-size:12.5px;color:var(--ink)}
.mpop svg{width:11px;height:11px;color:var(--text-3)}
.mpop select{appearance:none;border:0;background:none;font:inherit;color:inherit;outline:0;padding-right:2px;cursor:pointer}
.msw{display:flex;gap:10px}.msw button{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px #0000001a}.msw button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px currentColor}
.mbtn{padding:4px 12px;border-radius:6px;background:#fff;border:1px solid #E2E2DF;box-shadow:0 1px 1px #0000000a;font-size:12.5px}
.mbtn:hover{background:#FAFAF9}
.mbtn.blue{background:#0A64D8;border-color:#0A64D8;color:#fff}
.ms-body .group{box-shadow:none}
@media (max-width:900px){.mset{grid-template-columns:1fr}.ms-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:10px}.ms-lights,.ms-search,.ms-me,.ms-grp{display:none}.ms-item{white-space:nowrap;width:auto}.ms-row input.ms-in{width:140px}}

/* ===== real map (OpenStreetMap data), Google-style grayscale ===== */
.map{background:#F2F2F2!important}
.base .g-w{fill:#CFCFCF;stroke:none}
.base .g-rv{fill:none;stroke:#CFCFCF;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.base .g-pk{fill:#E3E3E3;stroke:none}
.base .g-cm{fill:#E6E6E6;stroke:none}
.base .g-gf{fill:#E1E1E1;stroke:none}
.base .g-s-c,.base .g-p-c{fill:none;stroke:#DCDCDC;stroke-linecap:round;stroke-linejoin:round}
.base .g-s-c{stroke-width:2.4}.base .g-p-c{stroke-width:3.4}
.base .g-s,.base .g-p{fill:none;stroke:#FFFFFF;stroke-linecap:round;stroke-linejoin:round}
.base .g-s{stroke-width:1.5}.base .g-p{stroke-width:2.4}
.base .g-m-c,.base .g-t-c{fill:none;stroke:#BDBDBD;stroke-linecap:round;stroke-linejoin:round}
.base .g-m-c{stroke-width:5}.base .g-t-c{stroke-width:4}
.base .g-m,.base .g-t{fill:none;stroke:#DADADA;stroke-linecap:round;stroke-linejoin:round}
.base .g-m{stroke-width:3.4}.base .g-t{stroke-width:2.6}
.base text.gl{fill:#7A7A7A!important;font:500 10px -apple-system,"SF Pro Text","Helvetica Neue",var(--f-ui)!important;letter-spacing:.02em!important;text-anchor:middle;paint-order:stroke;stroke:#F2F2F2;stroke-width:3px;stroke-linejoin:round}
.base text.gl.c{fill:#3E3E3E!important;font-weight:700!important;font-size:13px!important}
.base text.gl.s{fill:#9A9A9A!important;font-size:9px!important;letter-spacing:.08em!important;text-transform:uppercase}
#map svg.base text.gl{font-size:calc(10px * var(--k,1))!important;stroke-width:calc(3px * var(--k,1))}
#map svg.base text.gl.c{font-size:calc(13px * var(--k,1))!important}
#map svg.base text.gl.s{font-size:calc(9px * var(--k,1))!important}
.map-attr{position:absolute;right:10px;bottom:8px;z-index:3;font-size:10px;color:#8A8A8A;background:#FFFFFFcc;padding:2px 6px;border-radius:4px;pointer-events:none}
.map-legend span:last-child i{background:#D7262B!important}

/* attention pill v2 */
.attn-btn{height:auto!important;padding:7px 7px 7px 7px!important;gap:12px!important;border-radius:999px!important;background:linear-gradient(180deg,#1d1d1f,#101011)!important;border:1px solid #ffffff14;box-shadow:0 18px 40px -16px #14141499,0 2px 6px #1414141f,inset 0 1px 0 #ffffff14!important;max-width:min(560px,calc(100vw - 40px))}
.attn-btn:hover{background:linear-gradient(180deg,#252527,#151516)!important}
.attn-c{position:relative;width:34px;height:34px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px -4px #D7262Bcc}
.attn-c b{position:relative;font-family:var(--f-mono);font-size:13px;font-weight:600;color:#fff}
.attn-c i{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--red);animation:attnP 1.8s ease-out infinite}
.attn.clear .attn-c{background:var(--ok);box-shadow:none}.attn.clear .attn-c i{display:none}
.attn-tx{display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left;line-height:1.25}
.attn-tx b{font-size:13.5px;font-weight:600;color:#fff;letter-spacing:-.01em}
.attn-tx small{font-size:12px;color:#ffffff8c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.attn-go{margin-left:6px;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;background:#ffffff14;color:#fff;font-size:12.5px;font-weight:500;flex:none;transition:background .2s}
.attn-btn:hover .attn-go{background:#fff;color:#141414}
.attn-go svg{width:13px;height:13px;transition:transform .35s}
.attn.open .attn-go svg{transform:rotate(90deg)}
.attn-dot,.attn-n{display:none}

}

function areaChart(series,labels,{h=220,fmt=v=>v,colors=['#D7262B','#6B6F75'],names=['2026','2025']}={}){

  let grid='',yl='';for(let v=0;v<=top+1e-9;v+=step){grid+=`<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#E6E6E2" stroke-width="1" vector-effect="non-scaling-stroke" ${v?'stroke-dasharray="2 4"':''}/>`;yl+=`<span style="top:${y(v)/Hp*100}%">${fmt(v)}</span>`}
  const xl=labels.map((l,i)=>(i%2===0||labels.length<8)?`<span style="left:${i/(labels.length-1)*100}%">${l}</span>`:'').join('');

  const last=series[0].length-1;

  return `<div class="achart" style="height:${h}px" data-c="${data}"><div class="ay">${yl}</div><div class="aplot" style="height:${Hp}px"><svg viewBox="0 0 ${W} ${Hp}" preserveAspectRatio="none"><defs><linearGradient id="agr${h}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#D7262B" stop-opacity=".30"/><stop offset=".7" stop-color="#D7262B" stop-opacity=".04"/><stop offset="1" stop-color="#D7262B" stop-opacity="0"/></linearGradient></defs>${grid}${paths}</svg><i class="aend" style="left:100%;top:${y(series[0][last])/Hp*100}%"></i><i class="aline" hidden></i><div class="atip" hidden></div></div><div class="ax">${xl}</div></div>`;

  <select class="inp" id="cliSort" style="width:auto;height:34px;padding-block:0"><option value="score" ${cliSort==='score'?'selected':''}>Sort: Rating</option><option value="recent" ${cliSort==='recent'?'selected':''}>Sort: Newest</option><option value="name" ${cliSort==='name'?'selected':''}>Sort: Name</option></select></div></div>

  <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Client</th><th>Stage</th><th>Credit</th><th>Vehicle</th><th class="r">Payment</th><th>Rep</th><th>Rating</th><th></th></tr></thead><tbody>
  ${list.map(c=>`<tr class="link" data-go="${c.id}"><td><div class="who">${av(c.name)}<div><b>${c.name}</b><span>${c.id} · ${c.city}</span></div></div></td><td><span class="pill ${STAGE_PILL[c.stage]}"><i></i>${c.stage}</span></td><td><span class="muted">${c.tier}</span>${c.flags.length?`<span class="dim" style="font-size:12px;display:block">${c.flags[0]}</span>`:''}</td><td>${c.veh.year} ${c.veh.make} ${c.veh.model}<span class="dim" style="font-size:12px;display:block">${c.type}</span></td><td class="r num">${fmt$(c.pay)}<span class="dim">/mo</span></td><td>${c.rep.name}</td><td><div style="display:flex;align-items:center;gap:10px">${gradeBadge(c)}<div class="bar" style="width:70px"><i style="width:${c.score}%;background:var(--${{A:'ok',B:'info',C:'warn',D:'err'}[c.grade]})"></i></div></div></td><td>${c.trk?`<span class="pill ${c.trk.status==='alert'?'err':c.trk.status==='moving'?'ok':''}">${ic('gps','width="11" height="11"')}${c.trk.status==='alert'?'Alert':c.trk.status==='moving'?'Moving':'Parked'}</span>`:''}</td></tr>`).join('')||`<tr><td colspan="8" class="dim" style="padding:28px;text-align:center">No clients match "${esc(cliQ)}". Try a last name or a vehicle make.</td></tr>`}
  </tbody></table></div></div>`;
}
