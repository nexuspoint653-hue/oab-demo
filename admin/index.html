let profTab='Overview';
function vProfile(id){
  const c=byId(id);if(!c)return `<p>Client not found. <a href="#clients" style="color:var(--red)">Back to clients</a></p>`;
  const tabs=['Overview','Full Report',...(c.trk?['Vehicle & GPS','Payments']:[]),'Documents','Timeline'];
  if(!tabs.includes(profTab))profTab='Overview';
  const si=STAGES.indexOf(c.stage);
  let body='';
  if(profTab==='Overview')body=profOverview(c);
  if(profTab==='Full Report')body=profReport(c);
  if(profTab==='Vehicle & GPS')body=profGPS(c);
  if(profTab==='Payments')body=profPay(c);
  if(profTab==='Documents')body=profDocs(c);
  if(profTab==='Timeline')body=profTimeline(c);
  return `
  <a href="#clients" class="btn ghost sm" style="align-self:flex-start">${ic('back')}Clients</a>
  <div class="prof-h">
    ${av(c.name,'lg')}
    <div class="t" style="flex:1;min-width:220px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1>${c.name}</h1><span class="pill ${STAGE_PILL[c.stage]}"><i></i>${c.stage}</span></div>
      <div class="meta"><span class="mono">${c.id}</span><span>${ic('pin')}${c.city}, MI</span><span>${ic('phone')}${c.phone}</span><span>${ic('mail')}${c.email}</span><span>${ic('users')}${c.rep.name}</span></div></div>
    <div style="display:flex;align-items:center;gap:16px">${ring(c.score,84,7)}<div><div class="eyebrow">Performance rating</div><div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span class="grade ${gradeCls(c.grade)}" style="width:32px;height:32px;font-size:16px">${c.grade}</span><span class="muted" style="font-size:12.5px;max-width:18ch">${c.trk?'Based on '+c.perf.months+' months of data':'Deal readiness score'}</span></div></div></div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-toast="Text sent to ${esc(c.first)}">${ic('msg')}Text ${esc(c.first)}</button><button class="btn" data-toast="Booking link sent">${ic('cal')}Book appointment</button>${si<4?`<button class="btn pri" data-advance="${c.id}">${ic('arrow')}Move to ${STAGES[si+1]}</button>`:''}</div>
  <div class="tabs" id="profTabs">${tabs.map(t=>`<button class="${t===profTab?'on':''}">${t}</button>`).join('')}</div>
  <div class="fade">${body}</div>`;
}
function profOverview(c){
  const blk=(t,rows)=>`<div class="card"><div class="card-b"><div class="sec-t">${t}</div><div class="kv">${rows.map(r=>`<div><span>${r[0]}</span><b class="${r[2]||''}">${r[1]}</b></div>`).join('')}</div></div></div>`;
  return `<div class="grid g-main"><div class="grid">
    ${blk('Applicant',[['Date of birth',c.dob],['SSN',`•••-••-${c.ssn4}`,'ssn'],['Address',c.addr],['Source',c.source]])}
    ${blk('Employment',[['Occupation',c.occ],['Employer',c.employer],['Time employed',c.empYears+' years'],['Monthly gross income',fmt$(c.income)]])}
    ${blk('Credit',[['Credit tier',c.tier],['History',c.flags.join(', ')||'No flags'],['Co-signer',c.cosigner?'Yes':'No'],['Trade-in',c.trade?'Yes':'No'],['Lender',c.lender]])}
    ${blk('Vehicle',[['Vehicle',`${c.veh.year} ${c.veh.make} ${c.veh.model}`],['Deal type',c.type+(c.type==='Lease'?' · 10,000 mi/yr':'')],['Payment',fmt$(c.pay)+'/mo'],['Down payment',c.down?fmt$(c.down):'None'],['VIN',c.veh.vin,'mono']])}
  </div>
  <div class="grid" style="align-content:start">
    <div class="card"><div class="card-b"><div class="sec-t">Deal progress</div>${progress(c)}</div></div>
    <div class="card"><div class="card-b note-box"><div class="sec-t" style="margin:0">Notes</div>
      <div class="note"><div class="by">${c.rep.name} · 2 days ago</div>Prefers texts after 5 PM. Wants a dark exterior${c.trade?'. Trade-in has about $2k in equity.':'.'}</div>
      <textarea id="noteIn" placeholder="Add a note for the team"></textarea><button class="btn sm" style="align-self:flex-end" id="noteAdd">Add note</button></div></div>
  </div></div>`;
}
function progress(c){const si=STAGES.indexOf(c.stage);return `<div class="tl">${STAGES.map((s,i)=>`<div class="tl-i ${i<si||c.stage==='Delivered'?'done':i===si?'now':''}"><i></i><div><b>${s}</b><span>${i<si||(c.stage==='Delivered'&&i===si)?dstr(daysAgo(Math.max(0,c.appDays-i*2))):i===si?'Current · '+(c.stageAge||'<1')+' day(s)':'Pending'}</span></div></div>`).join('')}</div>`}
function profReport(c){
  const del=c.stage==='Delivered'&&!!c.trk;
  const col=v=>v>=85?'var(--ok)':v>=70?'var(--info)':v>=55?'var(--warn)':'var(--err)';
  const weakest=[...c.perf.cats].sort((a,b)=>a[2]-b[2])[0];
  const insp=['Tires and tread depth','Brake pads and rotors','Engine oil and fluids','Battery health','Lights and signals','Windshield and wipers','Body and paint','Interior condition','Check-engine codes','Suspension','A/C and heat','Tracker wiring intact'];
  const fails=del?24-c.perf.inspPass:0;
  return `<div class="grid g-main">
    <div class="card"><div class="card-h"><h3>${del?'Client performance report':'Deal readiness report'}</h3><div class="r"><span class="dim" style="font-size:12px">Updated ${del?'today 6:00 AM':'live'}</span></div></div><div class="card-b">
      ${c.perf.cats.map(k=>`<div class="report-cat"><div><b>${k[0]}</b><span>${k[1]} · weight ${Math.round(k[3]*100)}%</span></div><div class="bar" style="height:7px"><i style="width:${k[2]}%;background:${col(k[2])}"></i></div><div class="sc num" style="color:${col(k[2])}">${k[2]}</div></div>`).join('')}
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:14px;margin-top:4px;border-top:1px solid var(--border)"><b style="font-weight:500">Weighted rating</b><span style="display:flex;align-items:center;gap:10px"><span class="grade ${gradeCls(c.grade)}">${c.grade}</span><b class="num" style="font-family:var(--f-disp);font-size:22px">${c.score}</b></span></div>
    </div></div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="card-b"><div class="sec-t">Hub read</div><p style="font-size:13.5px;line-height:1.6">${del?`${c.first} is ${c.perf.late||c.perf.missed?'mostly':'fully'} current across ${c.perf.months} months. The weakest area is <b style="font-weight:500">${weakest[0].toLowerCase()}</b> (${weakest[2]}). ${c.perf.milesYr>10000?`At ${fmtN(c.perf.milesYr)} miles a year the lease will run about ${fmtN((c.perf.milesYr-10000)*3)} miles over. Offer a mileage add-on before year two.`:'Mileage is within the lease allowance.'}`:`${c.first}'s file is ${c.score>=70?'strong enough to submit':'not ready to submit yet'}. The weakest area is <b style="font-weight:500">${weakest[0].toLowerCase()}</b>. ${c.docsHave<5?`Collect the missing ${5-c.docsHave} document${5-c.docsHave>1?'s':''} first.`:''} ${c.tier==='Below 580'?'Route to Midwest Acceptance first.':''}`}</p></div></div>
      ${del?`<div class="card"><div class="card-h"><h3>Vehicle inspection</h3><div class="r"><span class="pill ${fails?'warn':'ok'}">${c.perf.inspPass}/24 passed</span></div></div><div class="card-b">${insp.map((p,i)=>{const f=i<fails&&i%2===0||(fails===3&&i===3);return `<div class="check">${f?ic('alert','style="color:var(--warn)"'):ic('check','style="color:var(--ok)"')}<span>${p}</span><span class="res dim">${f?'Service soon':'Pass'}</span></div>`}).join('')}<p class="dim" style="font-size:12px;margin-top:10px">12 of 24 points shown. Last inspection ${dstr(daysAgo(8+c.appDays%30))} at service pick-up.</p></div></div>`:
      `<div class="card"><div class="card-b"><div class="sec-t">Next best step</div><div class="list">${[c.docsHave<5?['Request missing documents','Sends a secure upload link by text']:null,['Soft-pull credit refresh','No impact on the client score'],['Pre-match 3 vehicles',`Under ${fmt$(c.pay+30)}/mo, ${c.veh.body}`]].filter(Boolean).map(s=>`<div class="li"><div class="t"><b>${s[0]}</b><span>${s[1]}</span></div><button class="btn sm" data-toast="${esc(s[0])}: done">Run</button></div>`).join('')}</div></div></div>`}
    </div></div>`;
}
function profGPS(c){
  const t=c.trk;
  return `<div class="grid g-main-r">
    <div class="grid" style="align-content:start">
      <div class="card"><div class="card-b"><div class="sec-t">Tracker ${t.dev}</div><div class="stats"><div class="stat"><span>Status</span><b style="color:${t.status==='alert'?'var(--err)':t.status==='moving'?'var(--ok)':'var(--text)'}">${t.status==='alert'?'Alert':t.status==='moving'?t.speed+' mph':'Parked'}</b></div><div class="stat"><span>Battery</span><b>${t.battery}%</b></div><div class="stat"><span>Odometer</span><b>${fmtN(t.odo)}</b></div><div class="stat"><span>Driving score</span><b>${c.perf.drive}</b></div><div class="stat"><span>Trips today</span><b>${t.tripsToday}</b></div><div class="stat"><span>Last ping</span><b style="font-size:13px">${t.ping}</b></div></div></div></div>
      <div class="card"><div class="card-b"><div class="sec-t">Recent events</div><div class="list">${t.events.map(e=>`<div class="li"><span class="sev ${e.s}"></span><div class="t"><b>${e.t}</b><span>${e.when}</span></div></div>`).join('')}</div></div></div>
      <div class="card"><div class="card-b"><div class="sec-t">Mileage vs lease allowance</div>${bars([['Allowance / yr',10000,'var(--text-3)'],['Current pace',c.perf.milesYr,c.perf.milesYr>10000?'var(--warn)':'var(--ok)']],{max:15000,fmt:fmtN})}</div></div>
    </div>
    <div class="map" style="border:1px solid var(--border);border-radius:var(--r-lg);min-height:520px">${mapSVG([c],c.id,traceFor(c))}<div class="map-legend"><span><i style="background:#007AFF"></i>Today's route</span><span><i style="background:#D7262B"></i>OAB office</span></div></div>
  </div>`;
}
function profPay(c){
  const rows=Array.from({length:Math.min(c.perf.months,8)},(_,i)=>{const d=daysAgo(i*30+(i%3));const late=i<c.perf.late+c.perf.missed&&i>0;const miss=c.perf.missed&&i===1;return [d,miss?'Missed':late?'Late · '+(4+i*2)+' days':'On time',miss?'err':late?'warn':'ok']});
  return `<div class="card"><div class="card-h"><h3>Payment history</h3><div class="r"><span class="pill ${c.perf.ontime>=95?'ok':c.perf.ontime>=80?'warn':'err'}">${c.perf.ontime}% on time</span></div></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Due</th><th class="r">Amount</th><th>Status</th><th>Method</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0].toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</td><td class="r num">${fmt$(c.pay,2)}</td><td><span class="pill ${r[2]}"><i></i>${r[1]}</span></td><td class="muted">${r[2]==='err'?'—':'Autopay · ACH'}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function profDocs(c){
  const all=c.docsNeeded;
  return `<div class="grid g-main"><div class="card"><div class="card-h"><h3>Documents</h3><div class="r"><span class="pill ${c.docsHave>=5?'ok':'warn'}">${c.docsHave} of 5</span></div></div><div class="card-b grid g-2">
    ${all.map((d,i)=>i<c.docsHave?`<div class="doc"><div class="th">${ic('doc')}</div><div class="t"><b>${d}</b><span>Verified ${dstr(daysAgo(Math.max(0,c.appDays-1)))} · Encrypted</span></div>${ic('check','width="16" height="16" style="color:var(--ok)"')}</div>`:`<div class="doc" style="border-style:dashed;background:none"><div class="th">${ic('upload')}</div><div class="t"><b>${d}</b><span>Not received</span></div><button class="btn sm" data-toast="Upload link texted to ${esc(c.first)}">Request</button></div>`).join('')}
  </div></div>
  <div class="grid" style="align-content:start"><div class="card"><div class="card-b"><div class="sec-t">Signatures</div>${c.stage==='New'?'<p class="dim">Collected when the application is submitted.</p>':`<div class="sig"><svg width="180" height="50" viewBox="0 0 180 50"><path d="M8 34c10-18 18-22 22-12s-6 16 2 12 14-24 20-18-4 22 6 16 12-16 20-14 2 14 12 10 14-10 22-8 10 8 22 2 18-6 30-4" fill="none" stroke="#18181A" stroke-width="1.8" stroke-linecap="round"/></svg></div><p class="dim" style="font-size:12px;margin-top:8px">Applicant signature · ${dstr(c.applied)} · IP logged</p>`}</div></div>
  <div class="card"><div class="card-b" style="display:flex;gap:10px;align-items:flex-start">${ic('shield','width="18" height="18" style="color:var(--gold);flex:none"')}<p class="muted" style="font-size:12.5px">SSN, date of birth, license images and signatures are encrypted at rest. Only Orlando and the assigned rep can see them in full.</p></div></div></div></div>`;
}
function profTimeline(c){
  const ev=[['Application submitted',c.source,c.appDays],['Soft credit pull','No score impact',c.appDays],['Documents requested','Secure link by text',Math.max(0,c.appDays-1)]];
  if(STAGES.indexOf(c.stage)>=2)ev.push(['Submitted to '+c.lender,'Deal packet sent',Math.max(0,c.appDays-3)]);
  if(STAGES.indexOf(c.stage)>=3)ev.push(['Approved',fmt$(c.pay)+'/mo · '+c.type,Math.max(0,c.appDays-5)]);
  if(c.stage==='Delivered'){ev.push(['Delivered to client','Home delivery · tracker '+c.trk.dev+' activated',Math.max(0,c.appDays-6)]);ev.push(['Monthly report generated','Rating '+c.score,1])}
  return `<div class="card"><div class="card-b"><div class="tl">${ev.reverse().map((e,i)=>`<div class="tl-i ${i===0?'now':'done'}"><i></i><div><b>${e[0]}</b><span>${e[1]} · ${dstr(daysAgo(e[2]))}</span></div></div>`).join('')}</div></div></div>`;

/* ================= premium layer: charts, count-up, command bar ================= */
function enhance(first){
  document.querySelectorAll('.achart').forEach(bindChart);
  if(first)countUp();
}
function bindChart(el){
  let d;try{d=JSON.parse(el.dataset.c)}catch(_){return}
  const plot=el.querySelector('.aplot'),line=el.querySelector('.aline'),tip=el.querySelector('.atip'),n=d.l.length;
  const cols=['#D7262B','#8A8E94'];
  const move=e=>{
    const r=plot.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const i=clamp(Math.round(cx/r.width*(n-1)),0,n-1),left=i/(n-1)*100;
    line.hidden=false;tip.hidden=false;line.style.left=left+'%';
    tip.innerHTML=`<span class="dim">Week of ${d.l[i]}</span>`+d.s.map((s,si)=>`<div><i style="background:${cols[si]}"></i>${d.n[si]||''}<b class="num">${d.t[si][i]}</b></div>`).join('');
    const tw=tip.offsetWidth,px=left/100*r.width;
    tip.style.left=clamp(px-tw/2,0,r.width-tw)+'px';
    tip.style.top=Math.max(0,(1-d.s[0][i]/d.top)*r.height-tip.offsetHeight-14)+'px';
  };
  const leave=()=>{line.hidden=true;tip.hidden=true};
  plot.addEventListener('mousemove',move);plot.addEventListener('mouseleave',leave);
  plot.addEventListener('touchstart',move,{passive:true});plot.addEventListener('touchmove',move,{passive:true});
}
function countUp(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('.kpi .val.num,.score-row b').forEach(el=>{
    const node=[...el.childNodes].find(n=>n.nodeType===3&&/\d/.test(n.textContent));if(!node)return;
    const txt=node.textContent,m=txt.match(/[\d,]*\.?\d+/);if(!m)return;
    const target=parseFloat(m[0].replace(/,/g,'')),dec=(m[0].split('.')[1]||'').length,comma=m[0].includes(',');
    const t0=performance.now(),dur=900;
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,4),v=target*e;
      let s=v.toFixed(dec);if(comma)s=Number(s).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
      node.textContent=txt.replace(m[0],s);if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

  wrap.innerHTML=`<div class="pal" role="dialog" aria-label="Search"><div class="pal-in">${ic('search','width="18" height="18"')}<input id="palQ" placeholder="Search clients, VINs, trackers, pages" autocomplete="off"><kbd>Esc</kbd></div><div class="pal-list" id="palList"></div><div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span></div></div>`;
  document.body.appendChild(wrap);
  const q=wrap.querySelector('#palQ'),list=wrap.querySelector('#palList'),all=paletteItems();
  let cur=[];
  const draw=()=>{
    const s=q.value.trim().toLowerCase();
    cur=(s?all.filter(x=>(x.t+' '+x.s).toLowerCase().includes(s)):all.filter(x=>x.g!=='Inventory').slice(0,14)).slice(0,40);
    palSel=clamp(palSel,0,Math.max(0,cur.length-1));
    let g='',h='';
    cur.forEach((x,i)=>{if(x.g!==g){g=x.g;h+=`<div class="pal-g">${g}</div>`}
      h+=`<button class="pal-i ${i===palSel?'on':''}" data-i="${i}"><span class="pal-ic">${ic(x.ic)}</span><span class="t"><b>${esc(x.t)}</b>${x.s?`<span>${esc(x.s)}</span>`:''}</span>${x.grade?`<span class="grade ${gradeCls(x.grade)}">${x.grade}</span>`:''}</button>`});
    list.innerHTML=h||`<p class="dim" style="padding:22px;text-align:center">Nothing matches "${esc(q.value)}". Try a last name, a VIN or a tracker ID.</p>`;
    list.querySelector('.pal-i.on')?.scrollIntoView({block:'nearest'});
    list.querySelectorAll('.pal-i').forEach(b=>{b.onclick=()=>go(+b.dataset.i);b.onmousemove=()=>{if(palSel!==+b.dataset.i){palSel=+b.dataset.i;list.querySelectorAll('.pal-i').forEach(x=>x.classList.toggle('on',x===b))}}});
  };
  const close=()=>wrap.remove();
  const go=i=>{const x=cur[i];if(!x)return;close();if(x.fn)x.fn();if(location.hash===x.h)render(true);else location.hash=x.h};
  q.oninput=()=>{palSel=0;draw()};
  q.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();palSel++;draw()}else if(e.key==='ArrowUp'){e.preventDefault();palSel--;draw()}else if(e.key==='Enter'){go(palSel)}else if(e.key==='Escape'){close()}};
  wrap.onclick=e=>{if(e.target===wrap)close()};
  palSel=0;draw();q.focus();
}

function startLive(){
  const mv=CLIENTS.filter(c=>c.trk&&c.trk.status==='moving');
  tick=setInterval(()=>{
    mv.forEach(c=>{
      c.trk.heading+=(rnd()-.5)*.6;
      c.trk.lat=clamp(c.trk.lat+Math.sin(c.trk.heading)*.0016,MB.lat1+.01,MB.lat0-.01);
      c.trk.lon=clamp(c.trk.lon+Math.cos(c.trk.heading)*.0022,MB.lon0+.01,MB.lon1-.01);
      c.trk.speed=clamp(c.trk.speed+ri(-6,6),12,68);
      const g=document.getElementById('pin-'+c.id);if(g){const p=px(c.trk.lat,c.trk.lon);g.style.transform=`translate(${p[0].toFixed(1)}px,${p[1].toFixed(1)}px)`}

/* colored avatars */
function av(name,cls=''){let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))%360;return `<span class="av ${cls}" style="background:hsl(${h} 42% 93%);color:hsl(${h} 38% 30%)">${initials(name)}</span>`}

/* ---------- chart primitives ---------- */
const COL={ok:'#1E9E5E',info:'#2F74C0',warn:'#E0A33A',err:'#D93F3C',red:'#D7262B',ink:'#18181A',gold:'#B08D4E',grey:'#C9CBC8'};
const scoreCol=v=>v>=85?COL.ok:v>=70?COL.info:v>=55?COL.warn:COL.err;
function donut(parts,{size=150,stroke=18,center='',sub=''}={}){
  const r=(size-stroke)/2,C=2*Math.PI*r,tot=parts.reduce((a,p)=>a+p[1],0);let off=0;
  const segs=parts.map(p=>{const len=p[1]/tot*C,gap=parts.length>1?2:0;const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p[2]}" stroke-width="${stroke}" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}"/>`;off+=len;return s}).join('');
  return `<div class="donut" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#F0F1EF" stroke-width="${stroke}"/>${segs}</svg><div class="dc"><b>${center}</b><span>${sub}</span></div></div>`;
}
function radar(cats,size=230){
  const n=cats.length,cx=size/2,cy=size/2+6,R=size/2-34;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
  let g='';[25,50,75,100].forEach(l=>{g+=`<polygon points="${cats.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="#ECEDEB"/>`});
  cats.forEach((_,i)=>{const p=pt(i,100);g+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#ECEDEB"/>`});
  const poly=cats.map((c,i)=>pt(i,c[2]).join(',')).join(' ');
  const lbl=cats.map((c,i)=>{const p=pt(i,122);return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="middle">${c[0].split(' ')[0]}</text>`}).join('');
  const dots=cats.map((c,i)=>{const p=pt(i,c[2]);return `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="${scoreCol(c[2])}" stroke-width="2"/>`}).join('');
  return `<svg class="radar" viewBox="-36 -4 ${size+72} ${size+18}" width="100%" style="max-width:${size+40}px">${g}<polygon points="${poly}" fill="#D7262B1a" stroke="#D7262B" stroke-width="1.8" stroke-linejoin="round"/>${dots}${lbl}</svg>`;
}
function gauge(v,label){
  const r=46,C=Math.PI*r;return `<div class="gauge"><svg viewBox="0 0 110 62" width="110" height="62"><path d="M9 56a46 46 0 0 1 92 0" fill="none" stroke="#F0F1EF" stroke-width="9" stroke-linecap="round"/><path d="M9 56a46 46 0 0 1 92 0" fill="none" stroke="${scoreCol(v)}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}"/></svg><b>${v}</b><span>${label}</span></div>`;
}
const miniRing=(v,col)=>{const r=20,C=2*Math.PI*r;return `<svg width="52" height="52" viewBox="0 0 52 52" style="transform:rotate(-90deg)"><circle cx="26" cy="26" r="${r}" fill="none" stroke="#F0F1EF" stroke-width="6"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}"/></svg>`};

/* ---------- carousel ---------- */
function carousel(title,slides,{per=1,id='c'+Math.random().toString(36).slice(2,7),sub=''}={}){
  return `<section class="card carousel" data-car="${id}" style="--per:${per}"><div class="car-h"><div><h3>${title}</h3>${sub?`<span class="dim">${sub}</span>`:''}</div><div class="car-nav"><button class="ib" data-dir="-1" aria-label="Previous">${ic('back')}</button><button class="ib" data-dir="1" aria-label="Next">${ic('arrow')}</button></div></div>
  <div class="car-track">${slides.map(s=>`<div class="slide">${s}</div>`).join('')}</div><div class="dots">${slides.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div></section>`;
}
function bindCarousels(){
  document.querySelectorAll('[data-car]').forEach(c=>{
    const tr=c.querySelector('.car-track'),dots=[...c.querySelectorAll('.dots i')];
    const per=+getComputedStyle(c).getPropertyValue('--per')||1;
    const step=()=>tr.querySelector('.slide').getBoundingClientRect().width+14;
    c.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>tr.scrollBy({left:step()*+b.dataset.dir,behavior:'smooth'}));

    tr.onscroll=()=>{const i=Math.round(tr.scrollLeft/step());dots.forEach((d,j)=>d.classList.toggle('on',j===i))};

function mapSVG(list,selId,trace){
  let tr='';
  if(trace){tr=`<polyline points="${trace.map(p=>px(p[0],p[1]).join(',')).join(' ')}" fill="none" stroke="#007AFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>`;
    const s=px(trace[0][0],trace[0][1]);tr+=`<circle cx="${s[0]}" cy="${s[1]}" r="5" fill="#FFFFFF" stroke="#007AFF" stroke-width="2.5"/>`}
  const ring=(on,st,i)=>(on||st!=='idle')?`<circle class="ring" r="10"><animate attributeName="r" values="10;${on?30:24}" dur="${on?1.6:2.2}s" begin="${(i%5)*.37}s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="${on?1.6:2.2}s" begin="${(i%5)*.37}s" repeatCount="indefinite"/></circle>`:'';
  const pins=list.map((c,i)=>{const p=px(c.trk.lat,c.trk.lon),on=c.id===selId;return `<g class="mp ${c.trk.status}${on?' on':''}" id="pin-${c.id}" data-id="${c.id}" style="transform:translate(${p[0].toFixed(1)}px,${p[1].toFixed(1)}px)" tabindex="0" role="button" aria-label="${esc(c.name)}"><g class="mpk">${ring(on,c.trk.status,i)}<circle class="halo" r="17"/><circle class="dotc" r="10"/><circle class="core" r="3.2"/></g></g>`}).join('');
  const sel=selId?list.find(c=>c.id===selId):null;
  return `<svg class="base" viewBox="0 0 ${MB.W} ${MB.H}" preserveAspectRatio="xMidYMid slice">${roadsSVG()}${tr}${pins.replace(`id="pin-${selId}"`,`id="pin-${selId}"`)}</svg>`.replace(/(<g class="mp[^"]* on"[\s\S]*?<\/g><\/g>)([\s\S]*)(<\/svg>)$/,'$2$1$3');
}
let CAM={x:500,y:350,w:1000},camRaf=0,fleetScroll=0;
function camTarget(){
  const c=byId(fleetSel),m=document.getElementById('map');if(!c||!m)return {x:500,y:350,w:1000};
  const p=px(c.trk.lat,c.trk.lon),wide=m.clientWidth>620,w=620;
  const x=p[0]+(wide?w*.2:0),y=p[1]+(wide?0:w*.7*.18);
  return {x:clamp(x,w/2,MB.W-w/2),y:clamp(y,w*.35,MB.H-w*.35),w};
}
function camApply(svg,c){const h=c.w*MB.H/MB.W;svg.setAttribute('viewBox',`${(c.x-c.w/2).toFixed(2)} ${(c.y-h/2).toFixed(2)} ${c.w.toFixed(2)} ${h.toFixed(2)}`);
  const k=c.w/1000;svg.style.setProperty('--k',k.toFixed(4));svg.querySelectorAll('.mpk').forEach(g=>g.setAttribute('transform',`scale(${k.toFixed(4)})`))}
function camFly(){
  const svg=document.querySelector('#map svg.base');if(!svg)return;
  cancelAnimationFrame(camRaf);const a={...CAM},b=camTarget();
  const d=Math.hypot(b.x-a.x,b.y-a.y),dur=Math.min(1500,650+d*1.6),bump=Math.min(360,d*.9);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||d<.5&&Math.abs(a.w-b.w)<.5){CAM=b;camApply(svg,b);return}
  camApply(svg,a);const t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=ease(k);
    CAM={x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e,w:Math.min(1000,a.w+(b.w-a.w)*e+Math.sin(Math.PI*k)*bump)};
    camApply(svg,CAM);if(k<1)camRaf=requestAnimationFrame(step)};
  camRaf=requestAnimationFrame(step);
}

  const appr=CLIENTS.find(c=>c.stage==='Approved');const al=del.find(c=>c.trk.status==='alert');
  return [
    appr&&{id:'a1',t:`Approve ${appr.name} at ${fmt$(appr.pay+24)}/mo`,s:`${appr.lender} · ${fmt$(appr.down||1500)} down`,b:'Approve',go:'#'+appr.id},
    stuck&&{id:'a2',t:`${stuck.name} is missing documents`,s:`Docs Needed · ${stuck.stageAge+2} days`,b:'Assign to Ray',go:'#'+stuck.id},
    al&&{id:'a3',t:`${al.veh.make} ${al.veh.model} left the service area`,s:`${al.name} · ${al.trk.dev}`,b:'Open in fleet',go:'#fleet'}].filter(Boolean);
}
function attnHTML(){
  const acts=attnActs(),left=acts.filter(a=>!doneActs.has(a.id)).length;
  return `<div class="attn ${attnShown?'in':''} ${attnOpen?'open':''} ${left?'':'clear'}" id="attn"><button class="attn-btn" id="attnBtn" aria-expanded="${attnOpen}"><span class="attn-c"><i></i><b>${left||'✓'}</b></span><span class="attn-tx"><b>${left?(left===1?'1 item needs you':left+' items need you'):'All caught up'}</b><small>${left?esc((acts.find(a=>!doneActs.has(a.id))||{}).t||''):'Nothing waiting on you'}</small></span><span class="attn-go">Review${ic('arrow')}</span></button>
  <div class="attn-panel" role="region" aria-label="Needs your decision"><div class="attn-h">${eb('Needs your decision — '+left)}<button id="attnClose">Close</button></div>
  ${acts.map(a=>`<div class="row ${doneActs.has(a.id)?'done':''}"><div class="t"><b>${esc(a.t)}</b><span class="mono">${esc(a.s)}</span></div><a class="btn ghost sm" href="${a.go}">Review</a><button class="btn sm" data-attn="${a.id}" data-msg="${esc(a.b)}">${doneActs.has(a.id)?'Done':esc(a.b)}</button></div>`).join('')}</div></div>`;
}
function attnMount(){
  const m=document.querySelector('.main');if(!m||document.getElementById('attn'))return;
  const w=document.createElement('div');w.innerHTML=attnHTML();m.insertBefore(w.firstElementChild,m.firstChild);attnBind();
  if(!attnShown)setTimeout(()=>{attnShown=true;document.getElementById('attn')?.classList.add('in')},600);
}
function attnRefresh(){const a=document.getElementById('attn');if(!a)return;const w=document.createElement('div');w.innerHTML=attnHTML();a.replaceWith(w.firstElementChild);attnBind()}
function attnBind(){
  const a=document.getElementById('attn');if(!a)return;
  a.querySelector('#attnBtn').onclick=e=>{e.stopPropagation();attnOpen=!attnOpen;a.classList.toggle('open',attnOpen)};
  a.querySelector('#attnClose').onclick=()=>{attnOpen=false;a.classList.remove('open')};
  a.querySelectorAll('.attn-panel a').forEach(l=>l.addEventListener('click',()=>{attnOpen=false}));
  a.querySelectorAll('[data-attn]').forEach(b=>b.onclick=()=>{if(doneActs.has(b.dataset.attn))return;doneActs.add(b.dataset.attn);const m=b.dataset.msg;
    toast(m==='Approve'?'Deal approved. Contract sent for e-signature':m==='Assign to Ray'?'Assigned to Ray. He gets a push now':'Opening fleet');
    if(m==='Open in fleet'){attnOpen=false;location.hash='#fleet';return}
    attnRefresh();if(route==='overview')rerenderView()});
}
document.addEventListener('click',e=>{const a=document.getElementById('attn');if(attnOpen&&a&&!a.contains(e.target)){attnOpen=false;a.classList.remove('open')}});

const RN=(()=>{const lines=[];['m','t','p','s'].forEach(k=>(OSMD[k]||'').split(';').filter(Boolean).forEach(w=>{let x=0,y=0;const pts=w.split(' ').map(t=>{const q=t.split(',');x+=+q[0];y+=+q[1];return [x,y]});if(pts.length>1)lines.push({k,pts,len:pts.slice(1).reduce((a,p,i)=>a+Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1]),0)})}));

function rnStep(st,dist){ // advance along the road network by dist map units
  let guard=0;
  while(dist>0&&guard++<60){const l=RN.lines[st.li],a=l.pts[st.seg],b=l.pts[st.seg+1],segL=Math.hypot(b[0]-a[0],b[1]-a[1])||1e-6;
    const left=st.dir>0?(1-st.t)*segL:st.t*segL;
    if(dist<left){st.t+=st.dir*dist/segL;dist=0;break}
    dist-=left;
    if(st.dir>0&&st.seg<l.pts.length-2){st.seg++;st.t=0;continue}
    if(st.dir<0&&st.seg>0){st.seg--;st.t=1;continue}
    // reached the end of this road: turn onto a connected road, else U-turn
    const endPt=st.dir>0?l.pts[l.pts.length-1]:l.pts[0];
    const opts=(RN.grid.get(RN.key(endPt[0],endPt[1]))||[]).filter(o=>o.li!==st.li&&RN.lines[o.li].len>15);

  <div class="mdl-b"><label class="up-drop"><input type="file" id="upF" multiple accept="image/*,.pdf"><span>${ic('upload')}</span><b>Drop files or click to browse</b><small>PDF, JPG or PNG · up to 25 MB each</small></label>
  <div class="up-list" id="upL"></div>${fld('Document type',sel('upT',["Driver's license",'Pay stubs','Proof of residence','Proof of insurance','Bank statements','Other'],"Driver's license"))}</div>
  <footer class="mdl-f"><button class="btn" data-x>Cancel</button><button class="btn pri" id="upGo">Upload</button></footer>`);
  document.getElementById('upF').onchange=e=>{document.getElementById('upL').innerHTML=[...e.target.files].map(f=>`<div class="up-it">${ic('doc')}<span>${esc(f.name)}</span><em>${(f.size/1024).toFixed(0)} KB</em><i><u></u></i></div>`).join('');requestAnimationFrame(()=>document.querySelectorAll('.up-it u').forEach(u=>u.style.width='100%'))};
  document.getElementById('upGo').onclick=()=>mDone('Documents uploaded','They are attached to the client file and marked received.')}

/* service area */
function mArea(){
  mOpen(mHead('GPS fleet','Service area','Vehicles outside this area trigger an alert.')+`
  <div class="mdl-b"><div class="sa-viz"><span class="sa-ring" id="saR"></span><span class="sa-c">${ic('gps')}<b>Southfield office</b></span></div>
  ${fld('Radius',`<div class="mf-range"><input type="range" id="saRad" min="10" max="120" value="45"><b id="saV">45 mi</b></div>`)}
  ${fld('Alert',segx('saA',['Push','Push and text','Email only'],'Push and text'))}</div>
  <footer class="mdl-f"><button class="btn" data-x>Cancel</button><button class="btn pri" id="saGo">Save area</button></footer>`);
  const r=document.getElementById('saRad');r.oninput=()=>{document.getElementById('saV').textContent=r.value+' mi';document.getElementById('saR').style.setProperty('--s',r.value/60)};r.oninput();
  document.getElementById('saGo').onclick=()=>mDone('Service area saved',`${r.value} miles around Southfield.`)}

/* integration settings */
function mIntg(name){
  mOpen(mHead('Integrations',esc(name),'Connection settings for this service.')+`
  <div class="mdl-b"><div class="mf-grid">${fld('Status',segx('igS',['Connected','Paused'],'Connected'),'span2')}${fld('Account',inp('igA','OAB Hub · Southfield'),'span2')}${fld('API key',inp('igK','oab_live_••••••••••••7f3a','','text','readonly'),'span2 mono')}${fld('Sync',sel('igY',['Real time','Every 15 minutes','Hourly','Daily'],'Real time'),'span2')}</div></div>
  <footer class="mdl-f"><button class="btn" data-x>Close</button><button class="btn pri" id="igGo">Save</button></footer>`);
  document.getElementById('igGo').onclick=()=>mDone(name+' saved')}

/* generic confirmation for everything else */
function mConfirm(msg){
  const verb=/^Text sent|Upload link/.test(msg)?['Messages','Send a text','Send text']:/Booking link/.test(msg)?['Appointments','Send booking link','Send link']:/Link copied/.test(msg)?['Share','Share this listing','Copy link']:/PDF/.test(msg)?['Reports','Export PDF','Export']:/Report/.test(msg)?['Reports','Update report','Apply']:/tasks/.test(msg)?['Tasks','Add to this week','Add task']:/Location request/.test(msg)?['GPS fleet','Request location','Ping tracker']:/Offer drafted/.test(msg)?['Acquisition','Draft offer','Draft offer']:/sign|Other sessions/i.test(msg)?['Security','Sign out other sessions','Sign out']:/Opens oautobrokers/.test(msg)?['Website','Open the public site','Open site']:/Removing/.test(msg)?['Team','Remove teammate','Remove']:/Viewing as/.test(msg)?['Team','View as teammate','Switch view']:['Action','Confirm',"Confirm"];
  const isTxt=/Text sent|Upload link|Booking link/.test(msg);const who=(msg.match(/to (.+)$/)||[])[1]||'the client';
  mOpen(mHead(verb[0],verb[1],'')+`<div class="mdl-b">${isTxt?`${fld('To',inp('cfTo',who),'')}${fld('Message',`<textarea class="mf-in" id="cfMsg" rows="4">${/Booking/.test(msg)?`Hi ${who}, here is your link to book a time with O Auto Brokers: oab.link/book`:/Upload/.test(msg)?`Hi ${who}, upload your documents securely here: oab.link/docs`:`Hi ${who}, this is O Auto Brokers. Quick update on your file, give us a call at (248) 864-8387.`}</textarea>`)}`:/Link copied/.test(msg)?`${fld('Listing link',inp('cfL','https://oautobrokers.org/#car-'+Math.random().toString(36).slice(2,7),'','text','readonly'),'mono')}`:`<p class="cf-p">${esc(msg.replace(/ opens here| connects once the back end is live/,''))}. Continue?</p>`}</div>
  <footer class="mdl-f"><button class="btn" data-x>Cancel</button><button class="btn pri" id="cfGo">${verb[2]}</button></footer>`,'sm');
  document.getElementById('cfGo').onclick=()=>{if(/Link copied/.test(msg))try{navigator.clipboard.writeText(document.getElementById('cfL').value)}catch(_){}if(/Opens oautobrokers/.test(msg)){window.open('https://oautobrokers.netlify.app/','_blank');mClose();return}mDone(msg.replace(/ opens here| connects once the back end is live/,''))}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-toast]');if(!b)return;e.preventDefault();e.stopPropagation();const m=b.dataset.toast;
  if(/Add vehicle/.test(m))mVehicle();else if(/New application/.test(m))mDeal();else if(/acquisition lead/.test(m))mAcq();else if(/Invite form/.test(m))mInvite();else if(/Upload opens/.test(m))mUpload();else if(/Service area/.test(m))mArea();else if(/settings open here/.test(m))mIntg(m.replace(' settings open here',''));else mConfirm(m)},true);
document.addEventListener('click',e=>{const a=e.target.closest('a[href="#pipeline"].btn.pri');if(a&&/New deal/i.test(a.textContent)){e.preventDefault();e.stopPropagation();mDeal()}},true);
ROUTES.overview=vOverview;ROUTES.settings=vSettings;
applyAccent();render();attnMount();
</script>
