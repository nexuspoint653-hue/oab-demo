<!doctype html>
<html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>O Auto Brokers</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@700&family=Saira:wght@500;600;700;800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --ink:#0B0B0C;--ink-2:#161618;--ink-3:#1E1E21;--ink-line:#2A2A2E;
  --paper:#F4F4F1;--white:#FFFFFF;--line:#E6E6E2;--line-2:#D6D6D1;
  --text:#0B0B0C;--muted:#63666B;--faint:#9A9CA1;--on-dark:#F4F4F1;--on-dark-2:#A7A9AE;--on-dark-3:#6E7075;
  --red:#D7262B;--red-2:#EF3A3F;--gold:#C8A96A;
  --ok:#1E9E5E;
  --f-cond:"Anton","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --wrap:1240px;--r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--text);font:15px/1.55 var(--f);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:8px}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.035em;text-wrap:balance}
p{margin:0}
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:24px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.eb{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.eb::before{content:"";width:18px;height:1px;background:currentColor;opacity:.6}
.dark .eb{color:var(--on-dark-2)}
.eb.c{justify-content:center}
.eb.c::after{content:"";width:18px;height:1px;background:currentColor;opacity:.6}
.sh{display:flex;flex-direction:column;gap:14px;margin-bottom:44px}
.sh.c{align-items:center;text-align:center}
.sh h2{font-size:clamp(32px,4.4vw,52px);line-height:1.02}
.sh h2 b{font-weight:600}
.sh h2 span{font-weight:300;color:var(--muted)}
.dark .sh h2 span{color:var(--on-dark-3)}
.sh p{color:var(--muted);max-width:56ch;font-size:15.5px}
.dark .sh p{color:var(--on-dark-2)}
.sh-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:40px}
.sh-row .sh{margin:0}
.cond{font-family:var(--f-cond);font-weight:400;letter-spacing:.005em;text-transform:uppercase;line-height:.92}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 22px;border-radius:999px;font-size:14px;font-weight:500;letter-spacing:-.01em;transition:transform .12s,background .12s,border-color .12s,color .12s;white-space:nowrap}
.btn svg{width:16px;height:16px;transition:transform .12s}
.btn:hover svg{transform:translateX(3px)}
.btn:active{transform:scale(.98)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 10px 30px -12px #D7262Bcc}
.btn.red:hover{background:var(--red-2)}
.btn.ink{background:var(--ink);color:#fff}
.btn.ink:hover{background:#26262A}
.btn.line{border:1px solid var(--line-2);background:#fff}
.btn.line:hover{border-color:var(--ink)}
.btn.glass{background:#ffffff14;border:1px solid #ffffff2e;color:#fff;backdrop-filter:blur(10px)}
.btn.glass:hover{background:#ffffff26}
.btn.sm{height:38px;padding:0 16px;font-size:13px}
.link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;border-bottom:1px solid currentColor;padding-bottom:2px}
.link svg{width:14px;height:14px}

/* photo slots */
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,#2A2B2F,#141416)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .48s cubic-bezier(.2,.7,.2,1)}
.ph.light{background:linear-gradient(135deg,#ECECE8,#DCDCD7)}

/* NAV */
.nav{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;z-index:50;display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
.nav-in{pointer-events:auto;width:100%;max-width:var(--wrap);display:flex;align-items:center;gap:18px;padding:8px 8px 8px 18px;border-radius:999px;background:#0B0B0C8c;border:1px solid #ffffff1f;backdrop-filter:blur(18px) saturate(140%);color:#fff;transition:background .18s,color .18s,border-color .18s,box-shadow .18s}
.nav.solid .nav-in{background:#FFFFFFe6;color:var(--ink);border-color:var(--line);box-shadow:0 10px 40px -20px #0003}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.03em;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 2px #ffffff30}
.nav-links{display:flex;gap:2px;margin-inline:auto;background:#ffffff12;border-radius:999px;padding:4px}
.nav.solid .nav-links{background:#F1F1EE}
.nav-links a{padding:7px 14px;border-radius:999px;font-size:13.5px;color:inherit;opacity:.8;transition:opacity .12s,background .12s}
.nav-links a:hover{opacity:1}
.nav-links a.on{background:#fff;color:var(--ink);opacity:1}
.nav.solid .nav-links a.on{background:var(--ink);color:#fff}
.nav-r{display:flex;align-items:center;gap:10px}
.nav-phone{font-size:13px;opacity:.85;white-space:nowrap}
.burger{display:none;width:40px;height:40px;border-radius:50%;background:#ffffff1a;place-items:center}
.nav.solid .burger{background:#F1F1EE}
.burger svg{width:18px;height:18px}
.mnav{visibility:hidden;position:fixed;inset:0;z-index:60;background:var(--ink);color:#fff;padding:90px 24px 24px;display:flex;flex-direction:column;gap:6px;transform:translateY(-100%);transition:transform .27s cubic-bezier(.7,0,.2,1)}
.mnav.open{transform:none;visibility:visible}
.mnav a{font-family:var(--f-cond);font-size:44px;text-transform:uppercase;line-height:1.1}
.mnav .x{position:absolute;top:22px;right:22px;width:44px;height:44px;border-radius:50%;background:#ffffff1a;display:grid;place-items:center}
.mnav .x svg{width:18px;height:18px}

/* HERO */
.hero{position:relative;min-height:min(920px,100svh);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--ink)}
.hero .ph{position:absolute;inset:0}
.hero .ph img{animation:heroZoom 18s ease-out both}
@keyframes heroZoom{from{transform:scale(1.12)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0B0B0C99 0%,#0B0B0C1a 30%,#0B0B0C33 55%,#0B0B0Cf2 100%),linear-gradient(90deg,#0B0B0Ccc 0%,transparent 60%);pointer-events:none}
.hero-in{position:relative;z-index:2;padding-block:140px 40px}
.hero .eb{color:#ffffffc0}
.hero h1{font-family:var(--f-cond);font-weight:400;text-transform:uppercase;font-size:clamp(64px,10.5vw,168px);line-height:.86;letter-spacing:0;margin-top:22px;max-width:11ch}
.hero h1 em{font-style:normal;color:var(--red)}
.hero-sub{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-top:28px}
.hero-sub p{max-width:44ch;font-size:16.5px;color:#ffffffc7;line-height:1.6}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.finder{position:relative;z-index:2;margin-top:44px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px;background:#ffffffeb;backdrop-filter:blur(16px);border-radius:22px;padding:6px;color:var(--ink);box-shadow:0 30px 80px -30px #000}
.fcell{display:flex;flex-direction:column;justify-content:center;padding:10px 18px;border-radius:16px;transition:background .12s;min-width:0}
.fcell:hover{background:#F1F1EE}
.fcell label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.fcell select{border:0;background:none;font-weight:500;font-size:15px;padding:2px 0 0;outline:0;appearance:none;cursor:pointer;width:100%;text-overflow:ellipsis}
.finder .btn{height:auto;border-radius:16px;padding:0 26px}
.hero-foot{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:26px;flex-wrap:wrap}
.thumbs{display:flex;gap:8px}
.thumbs button{width:74px;height:48px;border-radius:10px;overflow:hidden;border:2px solid transparent;opacity:.6;transition:all .15s}
.thumbs button.on{border-color:#fff;opacity:1}
.thumbs .ph{width:100%;height:100%}
.hstats{display:flex;gap:28px}
.hstats div b{display:block;font-size:22px;font-weight:600;letter-spacing:-.03em}
.hstats div span{font-size:12px;color:#ffffffa0}

/* marquee */
.brands{background:var(--ink);color:#ffffff66;border-top:1px solid #ffffff12;overflow:hidden;padding-block:26px}
.marq{display:flex;gap:70px;width:max-content;animation:marq 38s linear infinite}
.marq span{font-family:var(--f-cond);font-size:26px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.marq span i{font-style:normal;color:var(--red);margin-left:70px}
@keyframes marq{to{transform:translateX(-50%)}}

section{position:relative}
.sec{padding-block:120px}
.white{background:#fff}
.dark{background:var(--ink);color:var(--on-dark)}

/* categories */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.cat{border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 16px;background:#FAFAF8;display:flex;flex-direction:column;gap:14px;transition:border-color .15s,transform .21s cubic-bezier(.2,.7,.2,1),box-shadow .21s}
.cat:hover{border-color:var(--line-2);transform:translateY(-4px);box-shadow:0 24px 50px -30px #0004}
.cat .ph{aspect-ratio:16/10;border-radius:12px}
.cat:hover .ph img{transform:scale(1.05)}
.cat-f{display:flex;justify-content:space-between;align-items:center;padding-inline:4px}
.cat-f b{font-weight:600;font-size:15px}
.cat-f span{font-size:12px;color:var(--muted)}
.cat-f .arr{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;transition:all .15s}
.cat-f .arr svg{width:13px;height:13px}
.cat:hover .arr{background:var(--ink);border-color:var(--ink);color:#fff}

/* vehicle cards */
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.vc{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .21s cubic-bezier(.2,.7,.2,1),box-shadow .21s,border-color .15s}
.vc:hover{transform:translateY(-4px);box-shadow:0 30px 60px -34px #0005;border-color:var(--line-2)}
.vc .ph{aspect-ratio:16/10}
.vc:hover .ph img{transform:scale(1.05)}
.vc .tagl{position:absolute;top:12px;left:12px;z-index:2;display:flex;gap:6px}
.chip{font-size:11px;font-weight:500;padding:4px 10px;border-radius:999px;background:#ffffffe6;color:var(--ink);backdrop-filter:blur(6px)}
.chip.red{background:var(--red);color:#fff}
.chip.dk{background:#0B0B0Cb3;color:#fff}
.fav{position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;border-radius:50%;background:#ffffffe6;display:grid;place-items:center;transition:transform .12s}
.fav svg{width:15px;height:15px}
.fav.on{color:var(--red)}
.fav.on svg{fill:currentColor}
.fav:hover{transform:scale(1.08)}
.vb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.vt{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.vt h3{font-size:17px;font-weight:600;letter-spacing:-.025em;line-height:1.25}
.vt small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:3px}
.specs{display:flex;gap:6px;flex-wrap:wrap}
.spec{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);background:#F4F4F1;border-radius:8px;padding:4px 9px}
.spec svg{width:12px;height:12px}
.vf{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--line);margin-top:auto}
.price b{font-size:22px;font-weight:600;letter-spacing:-.035em}
.price span{font-size:12.5px;color:var(--muted)}
.dark .vc{background:var(--ink-2);border-color:var(--ink-line)}
.dark .spec{background:#ffffff0d;color:var(--on-dark-2)}
.dark .vf{border-color:var(--ink-line)}
.dark .price span,.dark .vt small{color:var(--on-dark-3)}

/* speedometer section */
.speed{overflow:hidden}
.speed .bgimg{position:absolute;inset:0;opacity:.28}
.speed .bgimg img{filter:grayscale(.4)}
.speed::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 55%,transparent 0%,#0B0B0C 80%);pointer-events:none}
.speed .wrap{position:relative;z-index:2}
.sp-grid{display:grid;grid-template-columns:1fr minmax(0,420px) 1fr;gap:34px;align-items:center}
.sp-col{display:flex;flex-direction:column;gap:12px}
.feat{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:#ffffff0a;border:1px solid #ffffff14;backdrop-filter:blur(8px);transition:background .15s,border-color .15s,transform .15s}
.feat:hover{background:#ffffff14;border-color:#ffffff2e;transform:translateX(4px)}
.sp-col.r .feat:hover{transform:translateX(-4px)}
.feat .fi{width:38px;height:38px;border-radius:11px;background:#ffffff12;display:grid;place-items:center;flex:none}
.feat .fi svg{width:17px;height:17px}
.feat b{display:block;font-weight:500;font-size:14px}
.feat span{font-size:12.5px;color:var(--on-dark-3)}
.gauge{position:relative;aspect-ratio:1;display:grid;place-items:center}
.gauge svg{width:100%;height:100%}
.gauge .gv{position:absolute;bottom:4%;text-align:center}
.gauge .gv b{font-size:64px;font-weight:600;letter-spacing:-.05em;line-height:1}
.gauge .gv b small{font-size:22px;color:var(--on-dark-2);font-weight:500}
.gauge .gv span{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-dark-2);margin-top:6px}

/* credit */
.cred{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.cr{border-radius:var(--r);border:1px solid var(--line);background:#FAFAF8;padding:24px;display:flex;flex-direction:column;gap:14px;min-height:250px;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.cr:hover{transform:translateY(-4px);box-shadow:0 24px 50px -30px #0004}
.cr .ci{width:44px;height:44px;border-radius:13px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.cr .ci svg{width:19px;height:19px}
.cr h3{font-size:19px;margin-top:auto}
.cr p{font-size:13.5px;color:var(--muted)}
.cr .big{position:absolute;right:-6px;top:6px;font-family:var(--f-cond);font-size:110px;line-height:1;color:#0B0B0C08}
.cr.feat-red{background:var(--red);color:#fff;border-color:var(--red)}
.cr.feat-red p{color:#ffffffcc}
.cr.feat-red .ci{background:#ffffff1f;border-color:#ffffff33}
.cr.feat-red .big{color:#ffffff14}

/* steps (editorial) */
.steps{border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:90px minmax(0,1.2fr) minmax(0,1fr) 44px;gap:24px;align-items:center;padding:30px 0;border-bottom:1px solid var(--line);transition:padding .18s}
.step:hover{padding-left:12px}
.step .n{font-family:var(--mono);font-size:13px;color:var(--faint)}
.step h3{font-family:var(--f-cond);font-weight:400;font-size:clamp(40px,5vw,64px);text-transform:uppercase;letter-spacing:.005em;line-height:1}
.step p{color:var(--muted);font-size:14.5px}
.step .go{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;transition:all .15s}
.step .go svg{width:15px;height:15px}
.step:hover .go{background:var(--red);border-color:var(--red);color:#fff}

/* mosaic */
.mosaic{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:220px;gap:14px}
.mosaic .ph{border-radius:16px}
.mosaic .ph:hover img{transform:scale(1.05)}
.m-a{grid-column:span 2;grid-row:span 2}
.m-b{grid-column:span 2}
.mosaic .cap{position:absolute;left:14px;bottom:14px;z-index:2}
.mosaic .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#0009)}
.mosaic .cap b{display:block;color:#fff;font-weight:500;font-size:15px}
.mosaic .cap span{color:#ffffffb3;font-size:12.5px}

/* testimonial arc */
.testi{padding-block:130px 0;overflow:hidden}
.testi .sh{position:relative;z-index:2}
.t-stage{position:relative;height:620px;margin-top:-10px}
.t-stage .ph{position:absolute;inset:0;background:none}
.t-stage .ph img{object-position:center 40%}
.t-stage::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#0B0B0C 0%,transparent 30%,transparent 55%,#0B0B0C 100%)}
.arc{position:absolute;left:50%;bottom:-160px;transform:translateX(-50%);width:min(900px,120vw);aspect-ratio:1.6;border-radius:50% 50% 0 0;background:radial-gradient(120% 90% at 50% 0%,#1E1E21f2,#0B0B0Cfa);border:1px solid #ffffff1f;border-bottom:0;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 12% 0;backdrop-filter:blur(10px)}
.arc .av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#C8A96A,#8A6C2E);display:grid;place-items:center;font-weight:600;color:#fff;margin-top:-80px;border:3px solid var(--ink)}
.arc b{margin-top:14px;font-weight:500}
.arc .role{font-size:12.5px;color:var(--on-dark-3)}
.stars{color:#F2C14E;letter-spacing:3px;margin:10px 0 14px;font-size:14px}
.arc q{font-size:clamp(18px,2.1vw,24px);line-height:1.45;letter-spacing:-.02em;max-width:34ch;quotes:none}
.arc-nav{display:flex;gap:8px;margin-top:22px}
.arc-nav button{width:40px;height:40px;border-radius:50%;border:1px solid #ffffff2e;display:grid;place-items:center;color:#fff;transition:background .12s}
.arc-nav button:hover{background:#ffffff1a}
.arc-nav svg{width:15px;height:15px}
.arc-dots{display:flex;gap:6px;margin-top:14px}
.arc-dots i{width:6px;height:6px;border-radius:6px;background:#ffffff40;transition:width .18s,background .18s}
.arc-dots i.on{width:20px;background:#fff}

/* docs */
.docs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:60px;align-items:center}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dc{border:1px solid var(--line);border-radius:16px;padding:20px;background:#fff;display:flex;flex-direction:column;gap:10px}
.dc .ci{width:40px;height:40px;border-radius:12px;background:#F4F4F1;display:grid;place-items:center}
.dc .ci svg{width:18px;height:18px}
.dc b{font-weight:600;font-size:15px}
.dc span{font-size:13px;color:var(--muted)}

/* concierge split */
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:60px;align-items:center}
.split .ph{aspect-ratio:4/5;border-radius:24px}
.clist{display:flex;flex-direction:column;margin-top:30px;border-top:1px solid var(--ink-line)}
.clist>div{display:grid;grid-template-columns:40px 1fr auto;gap:16px;align-items:center;padding:20px 0;border-bottom:1px solid var(--ink-line)}
.clist .ci{width:40px;height:40px;border-radius:12px;background:#ffffff0d;display:grid;place-items:center;color:var(--gold)}
.clist .ci svg{width:18px;height:18px}
.clist b{display:block;font-weight:500}
.clist span{font-size:13px;color:var(--on-dark-3)}
.clist em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.08em}

/* reserve band */
.reserve{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:center}
.reserve h2{font-size:clamp(34px,4.4vw,56px);line-height:1.02}
.reserve h2 span{font-weight:300;color:var(--muted)}
.reserve .ph{aspect-ratio:16/10;border-radius:24px}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}
.slot{padding:10px 14px;border-radius:12px;border:1px solid var(--line-2);font-size:13px;font-family:var(--mono);transition:all .12s;background:#fff}
.slot:hover{border-color:var(--ink)}
.slot.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* faq */
.faq{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:stretch}
.faq .ph{border-radius:24px;min-height:460px}
.qa{border:1px solid var(--line);border-radius:16px;background:#fff;margin-bottom:10px;overflow:hidden;transition:border-color .12s}
.qa.open{border-color:var(--line-2)}
.qa button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;text-align:left;font-weight:500;font-size:15px}
.qa .pm{width:30px;height:30px;border-radius:50%;background:#F4F4F1;display:grid;place-items:center;flex:none;transition:transform .18s,background .18s}
.qa .pm svg{width:13px;height:13px}
.qa.open .pm{transform:rotate(45deg);background:var(--ink);color:#fff}
.qa .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .21s ease}
.qa.open .ans{grid-template-rows:1fr}
.qa .ans>div{overflow:hidden}
.qa .ans p{padding:0 20px 20px;color:var(--muted);font-size:14px;max-width:62ch}

/* where to next */
.wtn{position:relative;min-height:640px;color:#fff;display:flex;align-items:flex-end;overflow:hidden;background:var(--ink)}
.wtn .ph{position:absolute;inset:0}
.wtn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0B0B0C40,#0B0B0C00 40%,#0B0B0Cd9)}
.wtn .wrap{position:relative;z-index:2;padding-bottom:40px}
.wtn h2{font-family:var(--f-cond);font-weight:400;font-size:clamp(72px,15vw,240px);line-height:.85;letter-spacing:0;text-transform:uppercase;white-space:nowrap}
.wtn-f{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:24px}
.wtn-f p{color:#ffffffc0;max-width:42ch}

/* footer */
.foot{background:var(--ink);color:var(--on-dark);padding-top:80px;overflow:hidden}
.fgrid{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:40px;padding-bottom:50px;border-bottom:1px solid var(--ink-line)}
.fgrid h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-dark-3);font-weight:500;margin-bottom:16px}
.fgrid a,.fgrid li{display:block;color:var(--on-dark-2);font-size:14px;padding:4px 0;list-style:none}
.fgrid ul{margin:0;padding:0}
.fgrid a:hover{color:#fff}
.news{display:flex;gap:6px;margin-top:20px;background:#ffffff0d;border:1px solid var(--ink-line);border-radius:999px;padding:5px;max-width:380px}
.news input{flex:1;min-width:0;background:none;border:0;outline:0;padding:0 14px;color:#fff}
.news input::placeholder{color:var(--on-dark-3)}
.fbig{font-family:var(--f-cond);font-size:clamp(70px,16.5vw,260px);line-height:.8;text-transform:uppercase;letter-spacing:0;color:#ffffff0f;white-space:nowrap;margin-top:30px;text-align:center;user-select:none}
.fbot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:22px;font-size:12.5px;color:var(--on-dark-3)}

/* reveal */
.rv{transition:transform .54s cubic-bezier(.2,.7,.2,1),opacity .54s}
.rv.pre{transform:translateY(34px)}
@media (prefers-reduced-motion:reduce){.rv.pre{transform:none;opacity:1}.hero .ph img,.marq{animation:none}}

/* mobile apply bar */
.mbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;display:none;gap:8px;padding:6px;border-radius:999px;background:#0B0B0Ce6;backdrop-filter:blur(14px);border:1px solid #ffffff1f}
.mbar .btn{flex:1;height:44px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;z-index:90;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:13.5px;transition:all .18s;pointer-events:none;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:15px;height:15px;color:#6EE0A2}
</style>

/* ===== inner pages ===== */
.page-top{padding-top:120px;background:#fff;border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:8px;font-size:12.5px;color:var(--muted);padding-block:10px 18px}
.crumbs a:hover{color:var(--ink)}
.ptitle{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:28px}
.ptitle h1{font-size:clamp(34px,4.6vw,56px);line-height:1}
.ptitle h1 span{font-weight:300;color:var(--muted)}
.ptitle p{color:var(--muted);margin-top:10px;max-width:60ch}
.disc{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:#F4F4F1;border-radius:12px;padding:12px 14px;max-width:520px}
.disc svg{width:16px;height:16px;flex:none;margin-top:1px}

.inv{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;padding-block:32px 110px}
.rail{position:sticky;top:96px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:22px}
.rail-h{display:flex;justify-content:space-between;align-items:center}
.rail-h b{font-weight:600}
.rail-h button{font-size:12.5px;color:var(--muted)}
.rail-h button:hover{color:var(--red)}
.fg{display:flex;flex-direction:column;gap:10px}
.fg>label,.fg .fl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.seg{display:flex;background:#F1F1EE;border-radius:12px;padding:4px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0000001f;font-weight:500}
.hist{display:flex;align-items:flex-end;gap:3px;height:54px}
.hist i{flex:1;background:#E4E4E0;border-radius:3px 3px 0 0;transition:background .12s}
.hist i.in{background:var(--ink)}
.range{position:relative;height:22px}
.range input{position:absolute;inset:0;width:100%;appearance:none;background:none;pointer-events:none;margin:0}
.range input::-webkit-slider-thumb{appearance:none;pointer-events:auto;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 2px 6px #0003;cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ink);cursor:grab}
.range::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:#E4E4E0;border-radius:2px}
.rvals{display:flex;justify-content:space-between;gap:10px}
.rvals span{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-family:var(--mono)}
.rvals span small{display:block;font-family:var(--f);font-size:10.5px;color:var(--muted)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;padding:6px 0}
.ck input{appearance:none;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:6px;display:grid;place-items:center;margin:0;transition:all .12s;cursor:pointer;flex:none}
.ck input:checked{background:var(--ink);border-color:var(--ink)}
.ck input:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.mk{display:flex;flex-wrap:wrap;gap:6px}
.mk button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;background:#fff;transition:all .12s}
.mk button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px}
.tog i{width:40px;height:23px;border-radius:23px;background:#DADAD5;position:relative;transition:background .12s;flex:none}
.tog i::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:transform .12s}
.tog.on i{background:var(--ok)}
.tog.on i::after{transform:translateX(17px)}
.tog small{display:block;font-size:12px;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.bar b{font-size:15px;font-weight:600}
.bar b span{color:var(--muted);font-weight:400}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px;min-width:240px}
.srch svg{width:15px;height:15px;color:var(--muted)}
.srch input{border:0;outline:0;background:none;flex:1;min-width:0}
.sel{height:42px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 36px 0 16px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#63666B 50%),linear-gradient(135deg,#63666B 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.inv .vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;border:1px dashed var(--line-2);border-radius:var(--r);background:#fff}
.empty b{display:block;font-size:17px;margin-bottom:6px}
.empty p{color:var(--muted)}
.fbtn{display:none}

/* detail */
.det{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;padding-block:24px 110px}
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto auto;gap:10px}
.gal .main{grid-column:1/-1;aspect-ratio:16/9;border-radius:20px}
.gal .th{aspect-ratio:4/3;border-radius:12px;cursor:pointer;outline:2px solid transparent;outline-offset:2px;transition:outline-color .12s}
.gal .th.on{outline-color:var(--ink)}
.dcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-top:18px}
.dcard h3{font-size:18px;margin-bottom:14px}
.dcard p{color:var(--muted);font-size:14.5px;max-width:70ch}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sg{background:#F7F7F5;border-radius:12px;padding:14px}
.sg span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sg b{font-size:16px;font-weight:600;letter-spacing:-.02em}
.flist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
.flist div{display:flex;gap:10px;align-items:center;font-size:14px}
.flist svg{width:16px;height:16px;color:var(--ok);flex:none}
.side{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:14px}
.buy{background:var(--ink);color:#fff;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:16px;overflow:hidden;position:relative}
.buy::before{content:"";position:absolute;right:-80px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#D7262B55,transparent 70%)}
.buy h2{font-size:24px;line-height:1.15;position:relative}
.buy .pr{display:flex;align-items:baseline;gap:6px;position:relative}
.buy .pr b{font-size:44px;font-weight:600;letter-spacing:-.05em}
.buy .pr span{color:var(--on-dark-2)}
.calc{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}
.calc .row{display:flex;justify-content:space-between;font-size:13px;color:var(--on-dark-2)}
.calc .row b{color:#fff;font-weight:500;font-family:var(--mono)}
.calc input[type=range]{width:100%;accent-color:var(--red)}
.buy .btn{width:100%}
.help{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center}
.help .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#E9E9E5,#D2D2CC);display:grid;place-items:center;font-weight:600;flex:none}
.help b{display:block;font-weight:600;font-size:14px}
.help span{font-size:13px;color:var(--muted)}

/* apply */
.apply{min-height:100svh;background:var(--ink);color:#fff;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.ap-l{position:relative;padding:130px 56px 56px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.ap-l .ph{position:absolute;inset:0;opacity:.45}
.ap-l::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0B0B0Ccc,#0B0B0C55 40%,#0B0B0Cf2)}
.ap-l>*{position:relative;z-index:2}
.ap-l h1{font-family:var(--f-cond);font-weight:400;font-size:clamp(56px,7vw,104px);line-height:.88;text-transform:uppercase;letter-spacing:0}
.ap-l .pts{display:flex;flex-direction:column;gap:14px;margin-top:30px}
.ap-l .pts div{display:flex;gap:12px;align-items:center;color:#ffffffcc;font-size:14.5px}
.ap-l .pts svg{width:18px;height:18px;color:var(--gold);flex:none}
.ap-r{background:var(--paper);color:var(--ink);padding:120px 56px 56px;display:flex;flex-direction:column}
.prog{display:flex;gap:6px;margin-bottom:10px}
.prog i{flex:1;height:4px;border-radius:4px;background:#DEDED9;overflow:hidden;position:relative}
.prog i.done::after,.prog i.now::after{content:"";position:absolute;inset:0;background:var(--ink)}
.prog i.now::after{background:var(--red)}
.pmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:34px}
.pmeta .saved{display:flex;align-items:center;gap:6px;color:var(--ok)}
.pmeta .saved i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.ap-r h2{font-size:34px;line-height:1.1}
.ap-r .lead{color:var(--muted);margin:10px 0 28px}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:7px}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:500}
.fld label small{color:var(--muted);font-weight:400}
.inp{height:52px;border:1px solid var(--line-2);border-radius:14px;background:#fff;padding:0 16px;outline:0;font-size:15px;transition:border-color .12s,box-shadow .12s}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 4px #0B0B0C0f}
.inp.err{border-color:#D93F3C;box-shadow:0 0 0 4px #D93F3C14}
.emsg{font-size:12px;color:#D93F3C;min-height:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{border:1px solid var(--line-2);border-radius:14px;padding:16px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:4px;transition:all .12s}
.opt b{font-weight:500;font-size:14.5px}
.opt span{font-size:12.5px;color:var(--muted)}
.opt:hover{border-color:var(--ink)}
.opt.on{border-color:var(--ink);background:var(--ink);color:#fff}
.opt.on span{color:#ffffffa6}
.bigv{font-size:44px;font-weight:600;letter-spacing:-.05em;margin:6px 0}
.ap-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:34px}
.sig{height:130px;border:1.5px dashed var(--line-2);border-radius:14px;background:#fff;position:relative;touch-action:none}
.sig canvas{width:100%;height:100%;display:block;cursor:crosshair}
.sig span{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--faint);pointer-events:none}
.sig button{position:absolute;right:10px;top:10px;font-size:12px;color:var(--muted);background:#F4F4F1;border-radius:999px;padding:4px 10px}
.consent{display:flex;gap:10px;font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:16px}
.consent input{margin-top:3px;accent-color:var(--ink)}
.secure{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:18px}
.secure svg{width:16px;height:16px;color:var(--ok);flex:none}
.done-s{display:flex;flex-direction:column;align-items:flex-start;gap:16px;margin-block:auto}
.done-s .ok{width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff}
.done-s .ok svg{width:30px;height:30px;stroke-width:2.6}

/* responsive */
@media (max-width:1100px){
  .nav-links{display:none}.burger{display:grid}.nav-phone{display:none}
  .cats,.cred{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sp-grid{grid-template-columns:1fr 1fr}.sp-grid .gauge{grid-column:1/-1;order:-1;max-width:380px;margin-inline:auto;width:100%}
  .docs,.split,.reserve,.faq{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  .inv{grid-template-columns:1fr}.rail{position:static;display:none}.rail.open{display:flex}.fbtn{display:inline-flex}
  .det{grid-template-columns:1fr}.side{position:static}
  .apply{grid-template-columns:1fr}.ap-l{min-height:420px;padding:120px 24px 40px}.ap-r{padding:40px 24px 60px}
}
@media (max-width:700px){
  .sec{padding-block:80px}
  .finder{grid-template-columns:1fr 1fr}.finder .btn{grid-column:1/-1;height:52px}
  .hstats{display:none}
  .cats,.cred,.vgrid,.inv .vgrid{grid-template-columns:1fr}
  .sp-grid{grid-template-columns:1fr}
  .step{grid-template-columns:40px 1fr;gap:6px 14px}.step p{grid-column:2}.step .go{display:none}
  .mosaic{grid-template-columns:1fr 1fr;grid-auto-rows:150px}.m-a{grid-column:span 2}
  .t-stage{height:520px}.arc{aspect-ratio:auto;height:420px;border-radius:220px 220px 0 0;padding:48px 24px 0;bottom:-40px}
  .dgrid{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .mbar{display:flex}
  .foot{padding-bottom:70px}
  .sgrid{grid-template-columns:1fr 1fr}.flist{grid-template-columns:1fr}
  .fgrid2,.opts.c4{grid-template-columns:1fr 1fr}
  .wtn{min-height:480px}
}
.det .vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:700px){.det .vgrid{grid-template-columns:1fr}}
@media (max-width:700px){.wtn h2{white-space:normal;font-size:clamp(64px,19vw,120px)}.hero h1{font-size:clamp(54px,15vw,90px)}}

/* ================= v2: BuffX nav + hero, real reviews, personal/business ================= */
:root{--f-tech:"Saira","Geist",ui-sans-serif,system-ui,sans-serif;--r:12px}
.tech{font-family:var(--f-tech);text-transform:uppercase;letter-spacing:.01em}
.bar-eb{display:inline-flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:inherit;opacity:.85}
.bar-eb::before{content:"";width:2px;height:14px;background:var(--red)}

/* NAV (BuffX style) */
.nav{top:calc(10px + env(safe-area-inset-top,0px))}
.nav-in{max-width:1180px;border-radius:4px;background:#0B0B0Cf0;border:1px solid #ffffff14;padding:0 10px 0 22px;height:64px;gap:24px;backdrop-filter:blur(14px)}
.nav.solid .nav-in{background:#0B0B0Cf2;color:#fff;border-color:#ffffff14;box-shadow:0 12px 40px -18px #0008}
.nav .logo{font-family:var(--f-tech);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.nav .logo .mark{width:32px;height:32px;border-radius:50%;font-family:var(--f-tech);box-shadow:inset 0 0 0 2px #fff}
.nav-links{background:none!important;gap:6px;padding:0}
.nav-links>a,.nav-links>.dd>button{font-family:var(--f-tech);font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:10px 12px;border-radius:0;opacity:.82;position:relative;color:#fff}
.nav-links>a::after,.nav-links>.dd>button::after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .21s cubic-bezier(.2,.7,.2,1)}
.nav-links>a:hover::after,.nav-links>a.on::after,.nav-links>.dd:hover>button::after{transform:scaleX(1)}
.nav-links>a.on,.nav.solid .nav-links>a.on{background:none;color:#fff;opacity:1}
.dd{position:relative}
.dd>button b{color:var(--red);font-weight:600;margin-left:6px;display:inline-block;transition:transform .18s}
.dd.open>button b,.dd:hover>button b{transform:rotate(45deg)}
.ddm{position:absolute;top:calc(100% + 12px);left:50%;transform:translate(-50%,6px);width:440px;background:#0B0B0C;border:1px solid #ffffff1a;border-radius:4px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;box-shadow:0 30px 60px -20px #000}
.dd:hover .ddm,.dd.open .ddm{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.ddm::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px}
.ddm a{font-family:var(--f-tech);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#ffffffb3;padding:9px 0;border-bottom:1px solid #ffffff0f;transition:color .12s,padding .15s}
.ddm a:hover{color:#fff;padding-left:6px}
.ddm a:hover::before{content:"— ";color:var(--red)}
.nav-cta{font-family:var(--f-tech);font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;height:46px;padding:0 22px;display:inline-flex;align-items:center;background:var(--red);color:#fff;border:2px solid #ffffffd9;border-radius:2px;transition:background .15s,box-shadow .15s}
.nav-cta:hover{background:var(--red-2);box-shadow:0 0 0 4px #D7262B33}
.nav-phone{font-family:var(--f-tech);letter-spacing:.08em;font-size:12.5px}
.burger{border-radius:2px;background:#ffffff14!important;color:#fff}

/* HERO (BuffX style) */
.hero2{position:relative;min-height:min(900px,100svh);color:#fff;overflow:hidden;background:var(--ink);display:flex;flex-direction:column;justify-content:center}
.hero2 .ph{position:absolute;inset:0}
.hero2 .ph img{animation:heroZoom 20s ease-out both;transition:opacity .48s}
.hero2::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0B0B0Cf2 0%,#0B0B0Cb3 42%,#0B0B0C33 75%,#0B0B0C66 100%),linear-gradient(180deg,#0B0B0C80 0%,transparent 22%,transparent 62%,#0B0B0C 100%);pointer-events:none}
.h2in{position:relative;z-index:2;padding-block:130px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:center}
.h2tags{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.h2tags .stars{color:#F2C14E;letter-spacing:2px;margin:0}
.hero2 h1{font-family:var(--f-tech);font-weight:700;text-transform:uppercase;font-size:clamp(46px,6.6vw,96px);line-height:.95;letter-spacing:-.005em;max-width:13ch}
.hero2 h1 em{font-style:normal;color:var(--red)}
.hero2 p.sub{max-width:46ch;font-size:16.5px;line-height:1.6;color:#ffffffc2;margin-top:22px}
.sq{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;font-family:var(--f-tech);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border-radius:2px;transition:background .15s,color .15s,border-color .15s,box-shadow .15s,transform .12s;white-space:nowrap}
.sq svg{width:15px;height:15px;transition:transform .15s}
.sq:hover svg{transform:translateX(3px)}
.sq:active{transform:scale(.98)}
.sq.red{background:var(--red);color:#fff;border:2px solid var(--red)}
.sq.red:hover{background:var(--red-2);border-color:var(--red-2);box-shadow:0 12px 30px -12px #D7262Bcc}
.sq.wht{background:#fff;color:var(--red);border:2px solid #fff}
.sq.wht:hover{background:transparent;color:#fff}
.sq.ol{border:1.5px solid currentColor;color:inherit;background:transparent}
.sq.ol:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.dark .sq.ol:hover{background:#fff;color:var(--ink);border-color:#fff}
.sq.sm{height:40px;padding:0 16px;font-size:11.5px}
.h2cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.badge-o{width:230px;height:230px;border-radius:50%;display:grid;place-items:center;position:relative}
.badge-o svg.ring{position:absolute;inset:0;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge-o .core{width:128px;height:128px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-family:var(--f-tech);font-weight:800;font-size:64px;box-shadow:inset 0 0 0 4px #fff,0 20px 60px -10px #D7262B99}
.h2stats{position:relative;z-index:2;margin-top:70px;border-top:1px solid #ffffff1f}
.h2stats .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-block:26px 34px;position:relative}
.h2stats .st{display:flex;flex-direction:column;gap:6px;position:relative;z-index:2}
.h2stats .st b{font-family:var(--f-tech);font-size:13px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.h2stats .st b::before{content:"";width:2px;height:14px;background:var(--red)}
.h2stats .st span{font-size:13.5px;color:#ffffffa0;padding-left:12px}
.ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-tech);font-weight:800;font-size:clamp(90px,15vw,230px);letter-spacing:.06em;color:#ffffff08;white-space:nowrap;pointer-events:none;z-index:1;line-height:1}
.finder2{position:relative;z-index:3;margin-top:34px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;background:#ffffff;color:var(--ink);border-radius:4px;overflow:hidden;box-shadow:0 30px 80px -30px #000;max-width:880px}
.finder2 .fcell{border-radius:0;border-right:1px solid var(--line);padding:12px 18px}
.finder2 .sq{height:auto;border-radius:0}

/* section heading style */
.sh h2,.sh-row h2{letter-spacing:-.035em}
.eb::before{width:2px;height:12px;background:var(--red);opacity:1}
.eb.c::after{display:none}

/* PERSONAL / BUSINESS */
.pb-tabs{display:inline-flex;border:1.5px solid var(--ink);border-radius:2px;margin-bottom:28px}
.pb-tabs button{font-family:var(--f-tech);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:12px 26px;transition:background .15s,color .15s}
.pb-tabs button.on{background:var(--ink);color:#fff}
.pb{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.pb .ph{min-height:520px}
.pb .ph .tagp{position:absolute;left:18px;top:18px;z-index:2;font-family:var(--f-tech);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;background:var(--red);color:#fff;padding:7px 12px;border-radius:2px}
.pb-b{padding:44px;display:flex;flex-direction:column;gap:18px}
.pb-b h3{font-family:var(--f-tech);text-transform:uppercase;font-size:clamp(28px,3vw,40px);line-height:1;letter-spacing:0}
.pb-b>p{color:var(--muted);max-width:48ch}
.pb-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pb-list div{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.pb-list i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--red);padding-top:3px}
.pb-list b{display:block;font-weight:600;font-size:14.5px}
.pb-list span{font-size:13px;color:var(--muted)}
.pb-q{background:#F6F6F3;border-left:2px solid var(--red);padding:14px 16px;font-size:13.5px;color:var(--text)}
.pb-q small{display:block;color:var(--muted);margin-top:6px;font-size:12px}
.fadein{animation:fadein .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadein{from{transform:translateY(8px)}}

/* CREDIT cards with real visuals */
.cr{min-height:300px;border-radius:6px;padding:0;gap:0}
.cr .viz{height:140px;border-bottom:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden;background:#fff}
.cr .cb{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.cr h3{margin:0;font-size:18px}
.cr .big{display:none}
.cr.feat-red .viz{background:#C21F24;border-color:#ffffff24}
.cr .tagn{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.cr.feat-red .tagn{color:#ffffffa0}
.scorebar{width:78%;display:flex;flex-direction:column;gap:10px}
.scorebar .track{height:10px;border-radius:10px;background:linear-gradient(90deg,#D93F3C,#E0A33A 45%,#1E9E5E);position:relative}
.scorebar .pin{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink);transform:translate(-50%,-50%);transition:left 1.6s cubic-bezier(.2,.7,.2,1)}
.scorebar .lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:#ffffffb3}
.scorebar .val{font-family:var(--f-tech);font-size:30px;font-weight:700;color:#fff;text-align:center;letter-spacing:0}
.timeline{display:flex;align-items:center;gap:0;width:80%}
.timeline span{flex:none;width:12px;height:12px;border-radius:50%;background:#DADAD5}
.timeline span.on{background:var(--ok);box-shadow:0 0 0 4px #1E9E5E26}
.timeline i{flex:1;height:2px;background:#DADAD5}
.timeline i.on{background:var(--ok)}
.tl-l{display:flex;justify-content:space-between;width:80%;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:10px}
.chap{display:flex;gap:10px}
.chap div{border:1.5px solid var(--ink);border-radius:4px;padding:10px 14px;text-align:center}
.chap div b{display:block;font-family:var(--f-tech);font-size:26px;line-height:1}
.chap div span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chap div.ok{border-color:var(--ok);color:var(--ok)}
.firstkey{display:flex;align-items:center;gap:14px}
.firstkey .z{font-family:var(--f-tech);font-size:44px;font-weight:700;color:#D3D3CE;line-height:1}
.firstkey .arr{width:46px;height:2px;background:var(--ink);position:relative}
.firstkey .arr::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--ink);border-right:0}
.firstkey .kk{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.firstkey .kk svg{width:24px;height:24px}

/* HOW IT WORKS — smooth color hover */
.step{position:relative;overflow:hidden;transition:padding .36s cubic-bezier(.2,.7,.2,1),color .30s;isolation:isolate}
.step::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#D7262B0f,#D7262B05 60%,transparent);transform:scaleX(0);transform-origin:left;transition:transform .42s cubic-bezier(.2,.7,.2,1);z-index:-1}
.step:hover{padding-left:18px}
.step:hover::before{transform:scaleX(1)}
.step h3{transition:color .30s,letter-spacing .36s cubic-bezier(.2,.7,.2,1)}
.step:hover h3{color:var(--red)}
.step .n{transition:color .30s}
.step:hover .n{color:var(--red)}
.step p{transition:color .30s}
.step:hover p{color:var(--text)}
.step .go{transition:background .27s,border-color .27s,color .27s,transform .36s cubic-bezier(.2,.7,.2,1)}
.step:hover .go{transform:rotate(-45deg)}

/* REVIEWS marquee */
.revs{overflow:hidden;padding-block:120px 110px}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:46px}
.gscore{display:flex;align-items:center;gap:16px;border:1px solid #ffffff1f;border-radius:4px;padding:14px 20px}
.gscore b{font-family:var(--f-tech);font-size:40px;font-weight:700;line-height:1}
.gscore .stars{color:#F2C14E;letter-spacing:3px;margin:0}
.gscore span{font-size:12.5px;color:var(--on-dark-2)}
.rrow{display:flex;gap:16px;width:max-content;animation:marq 70s linear infinite}
.rrow.rev{animation-direction:reverse;animation-duration:80s;margin-top:16px}
.revs:hover .rrow{animation-play-state:paused}
.rc{width:380px;flex:none;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:14px;transition:border-color .18s,transform .24s cubic-bezier(.2,.7,.2,1)}
.rc:hover{border-color:#ffffff38;transform:translateY(-4px)}
.rc .top{display:flex;align-items:center;gap:12px}
.rc .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.rc .top b{display:block;font-weight:500;font-size:14.5px}
.rc .top span{font-size:12px;color:var(--on-dark-3)}
.rc .g{margin-left:auto;font-family:var(--f-tech);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-3);border:1px solid var(--ink-line);border-radius:2px;padding:4px 8px}
.rc .stars{color:#F2C14E;letter-spacing:2px;font-size:13px;margin:0}
.rc p{font-size:14.5px;line-height:1.55;color:#E7E7E3}
.rc .car{font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:auto}
.revs .edge{position:absolute;top:0;bottom:0;width:120px;z-index:3;pointer-events:none}
.revs .edge.l{left:0;background:linear-gradient(90deg,var(--ink),transparent)}
.revs .edge.r{right:0;background:linear-gradient(-90deg,var(--ink),transparent)}

/* concierge list with photo thumbs instead of generic icons */
.clist>div{grid-template-columns:72px 1fr auto;gap:18px;transition:padding .30s cubic-bezier(.2,.7,.2,1)}
.clist>div:hover{padding-left:8px}
.clist .thumb{width:72px;height:52px;border-radius:4px;overflow:hidden;position:relative}
.clist .thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(.35);transition:filter .30s,transform .36s}
.clist>div:hover .thumb img{filter:none;transform:scale(1.08)}

/* sharpen buttons/cards a touch to match the BuffX language */
.btn{border-radius:2px;font-family:var(--f-tech);text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;font-weight:700}
.btn.sm{font-size:11.5px}
.vc,.cat,.dc,.qa,.slot,.mosaic .ph,.reserve .ph,.faq .ph,.split .ph{border-radius:6px!important}
.chip{border-radius:2px;font-family:var(--f-tech);letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;font-weight:600}
.fav{border-radius:2px}
.wtn h2,.fbig{font-family:var(--f-tech);font-weight:800;letter-spacing:.01em}
.news{border-radius:2px}
.news .btn{border-radius:2px}

.dk-h h1 span{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:13px;background:var(--red);color:#fff;font-size:13px;margin-left:6px;padding:0 7px;vertical-align:3px}
.dk-h h1 span:empty{display:none}
.dk-h p{font-size:13.5px;color:var(--muted);margin-top:6px}
.dk-list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.dk-rq{background:#fff;border:1px solid #1A191614;border-radius:14px;padding:16px 18px;transition:box-shadow .4s,border-color .4s}
.dk-rq.flash{border-color:var(--red);box-shadow:0 0 0 4px #D7262B22}
.dk-rq.declined{opacity:.6}
.dk-rt{display:flex;justify-content:space-between;align-items:center}.dk-rt b{font-size:15.5px}
.dk-st{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:#F1F1ED;color:#6E6A63}
.dk-st.pending{background:#FFF4DB;color:#8A6200}.dk-st.confirmed{background:#E4F5EC;color:#137A45}.dk-st.declined{background:#F7E4E4;color:#A5262A}
.dk-when{font-size:14px;margin-top:6px}.dk-ct{font-size:13px;color:var(--muted);margin-top:4px}.dk-ct a{text-decoration:underline}
.dk-fit{font-size:12.5px;margin-top:10px;padding:8px 10px;border-radius:8px}.dk-fit.ok{background:#E4F5EC;color:#137A45}.dk-fit.bad{background:#F7E4E4;color:#A5262A}
.dk-acts{display:flex;gap:8px;margin-top:12px}
.dk-acts button{flex:1;height:40px;border-radius:10px;border:1px solid #1A191626;background:#fff;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:background-color .2s,color .2s}
.dk-acts button.ok{background:#111;color:#fff;border-color:#111}.dk-acts button.ok:hover{background:#1E9E5E;border-color:#1E9E5E}
.dk-acts button:not(.ok):not(.ghost):hover{background:#F7E4E4;color:#A5262A}
.dk-acts button.ghost{flex:.8;color:var(--muted)}
.dk-empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px;background:#fff;border:1px dashed #1A191626;border-radius:14px}
.dk-sub{font-family:var(--f)!important;font-size:13px!important;letter-spacing:.08em;color:var(--muted);margin:18px 0 2px;font-weight:700!important}
.dk-cal{background:#fff;border:1px solid #1A191614;border-radius:16px;padding:22px;align-self:start}
.dk-ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.dk-nav{display:flex;gap:6px}.dk-nav button{height:36px;min-width:36px;padding:0 12px;border-radius:9px;border:1px solid #1A191622;background:#fff;font:inherit;font-size:14px;cursor:pointer}
.dk-nav button:hover{background:#111;color:#fff}
.dk-grid{display:grid;grid-template-columns:60px repeat(5,minmax(0,1fr));border-top:1px solid #1A191612}
.dk-dh{text-align:center;padding:10px 0;border-bottom:1px solid #1A191612}.dk-dh span{display:block;font-size:12px;color:var(--muted)}.dk-dh b{font-size:18px}
.dk-dh.today b{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff}
.dk-hr{font-size:11.5px;color:var(--muted);padding:4px 8px 0 0;text-align:right;height:56px;border-bottom:1px solid #1A19160c}
.dk-cell{position:relative;height:56px;border-left:1px solid #1A19160f;border-bottom:1px solid #1A19160c}
.dk-cell.closed{background:repeating-linear-gradient(135deg,transparent 0 6px,#0000000a 6px 12px)}
.dk-ev{position:absolute;left:4px;right:4px;height:24px;border-radius:6px;padding:2px 7px;font-size:11px;line-height:1.15;overflow:hidden;cursor:pointer;z-index:1}
.dk-ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dk-ev span{display:none}
.dk-ev.confirmed{background:#E4F5EC;border-left:3px solid #1E9E5E}
.dk-ev.pending{background:#FFF8E8;border:1.5px dashed #D9A21B}
.dk-ev:hover{height:auto;min-height:48px;z-index:3;box-shadow:0 8px 20px -8px #0004}.dk-ev:hover span{display:block;color:#6E6A63}
@media (max-width:1000px){.dk-main{grid-template-columns:1fr}.dk-cal{overflow:auto}.dk-grid{min-width:620px}}
.bk-hd h2{max-width:22ch}
.dk-acts{flex-wrap:wrap}.dk-acts button.ghost{flex:1 1 100%;height:32px;border:0;text-decoration:underline;background:none}
/* v39: concierge chat — dark, thin, red accents, auto-playing story + hover prompts */
.cx{background:radial-gradient(120% 60% at 50% 0%,#2A0E10 0%,#121214 45%,#0D0D0F 100%);color:#fff;border:1px solid #ffffff14;border-radius:22px;box-shadow:0 40px 90px -40px #000,inset 0 1px 0 #ffffff0d}
.cx *{font-weight:400!important}
.cx .cc-h{border-bottom:1px solid #ffffff0f;padding:18px 20px}
.cx .cc-h b{font-size:15.5px;color:#fff}
.cx .cc-h small{color:#ffffff80;font-size:12.5px}
.cx .cc-h small i{background:var(--red);box-shadow:0 0 0 3px #D7262B33}
.cx-orb{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 1px #ffffff1f,0 0 24px -4px #D7262B99}
.cx-orb img{width:100%;height:100%;display:block}
.cx-orb.lg{width:60px;height:60px;box-shadow:0 0 0 1px #ffffff1f,0 0 40px -6px #D7262Bcc;animation:cxPulse 4s ease-in-out infinite}
@keyframes cxPulse{50%{box-shadow:0 0 0 1px #ffffff26,0 0 56px -4px #D7262Bdd}}
.cx-rs{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid #ffffff14;background:none;color:#ffffff99;display:grid;place-items:center;cursor:pointer;transition:color .3s,border-color .3s,transform .5s}
.cx-rs:hover{color:#fff;border-color:#ffffff40;transform:rotate(-90deg)}.cx-rs svg{width:15px;height:15px}
.cx-stage{position:relative;flex:1;min-height:0;display:flex}
.cx .cc-body{flex:1;padding:22px 20px}
.cx-empty{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .4s,transform .4s}
.cx-empty.gone{opacity:0;transform:translateY(-8px)}
.cx-empty p{font-size:17px;color:#fff;margin-top:10px}.cx-empty small{font-size:13px;color:#ffffff73}
.cx .cc-m{font-size:14.5px;line-height:1.6}
.cx .cc-m.bot,.cx .cc-m.bot+.cc-m.bot,.cx .cc-m.me+.cc-m.bot{background:none;color:#ffffffd9;padding:0 0 0 14px;border-left:1px solid #D7262B80;border-radius:0}
.cx .cc-m.me{background:#ffffff0d;border:1px solid #ffffff17;color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px}
.cx .cc-m.typing span{background:#D7262B}
/* hover prompts overlay */
.cx-prompts{position:absolute;inset:0;padding:22px 20px;display:flex;flex-direction:column;gap:8px;justify-content:center;background:linear-gradient(180deg,#0D0D0Fe6,#0D0D0Ff2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .6s cubic-bezier(.2,.7,.2,1),visibility 0s linear .6s}
.cx.show-p .cx-prompts{opacity:1;visibility:visible;transition:opacity .6s cubic-bezier(.2,.7,.2,1),visibility 0s}
.cx-prompts>span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#ffffff66;margin-bottom:6px}
.cx-prompts button{text-align:left;font:inherit;font-size:14.5px;color:#ffffffd9;background:none;border:1px solid #ffffff14;border-radius:12px;padding:12px 16px;cursor:pointer;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s cubic-bezier(.2,.7,.2,1),border-color .3s,color .3s,background-color .3s}
.cx.show-p .cx-prompts button{opacity:1;transform:none}
.cx.show-p .cx-prompts button:nth-of-type(2){transition-delay:.05s}.cx.show-p .cx-prompts button:nth-of-type(3){transition-delay:.1s}.cx.show-p .cx-prompts button:nth-of-type(4){transition-delay:.15s}.cx.show-p .cx-prompts button:nth-of-type(5){transition-delay:.2s}.cx.show-p .cx-prompts button:nth-of-type(6){transition-delay:.25s}
.cx-prompts button:hover{border-color:#D7262B99;color:#fff;background:#D7262B14;transition-delay:0s!important}
.cx-bar{display:block;height:1px;background:#ffffff14;margin-top:10px;overflow:hidden}
.cx-bar u{display:block;height:100%;width:0;background:var(--red)}
.cx-prompts.run .cx-bar u{animation:cxBar 5s linear forwards}
@keyframes cxBar{to{width:100%}}
/* input */
.cx .cc-f{border-top:0;padding:14px 16px 16px}
.cx-in{flex:1;border:1px solid #ffffff17;border-radius:16px;background:#ffffff08;padding:12px 12px 10px 16px;transition:border-color .3s,box-shadow .3s}
.cx-in:focus-within{border-color:#D7262B80;box-shadow:0 0 0 4px #D7262B14}
.cx .cc-f input{height:auto;border:0;background:none;padding:0;color:#fff;font-size:15px;width:100%}
.cx .cc-f input:focus{background:none}
.cx .cc-f input::placeholder{color:#ffffff59}
.cx .cc-f input.cx-ty{color:#ffffffcc}
.cx-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.cx-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#ffffff80;border:1px solid #ffffff14;border-radius:999px;padding:5px 10px}
.cx-tag i{width:6px;height:6px;border-radius:50%;background:var(--red)}
.cx .cc-f button[type=submit]{width:36px;height:36px;border-radius:10px;background:var(--red);border:0;color:#fff}
.cx .cc-f button[type=submit]:hover{background:#fff;color:var(--red);transform:none}
.cx .cc-f button svg{width:17px;height:17px}
.cx .cc-nav button{color:#ffffffcc;border:1px solid #ffffff1f;background:none}
.cx .cc-nav button:first-child{background:none;color:#fff;border-color:#D7262B80}
.cx .cc-nav button:hover{background:#D7262B1f;border-color:var(--red);color:#fff}
.cx .cc-body::-webkit-scrollbar{width:4px}.cx .cc-body::-webkit-scrollbar-thumb{background:#ffffff1a;border-radius:2px}
/* hero buttons: thinner outlines */
.bxh .h2cta .sq.red{border-width:1px!important;border-color:#ffffffb3!important}
.bxh .h2cta .sq.wht{border-width:1px!important}
/* book heading: left aligned, smaller title, bigger eyebrow */
.bk-hd{text-align:left;margin-bottom:36px}
.bk-hd .eb{justify-content:flex-start;font-size:14.5px!important;letter-spacing:.2em}
.bk-hd h2{margin:12px 0 0!important;max-width:none;font-size:clamp(30px,3.4vw,52px)!important}
.bk-hd p{margin-top:12px}
/* inventory toolbar: sort aligned with search */
.inv .bar{align-items:center}
.inv .bar>div{align-items:center}
.inv .bar .ps{display:flex;align-items:center;height:44px;padding:0 16px;border:1px solid #1A19161a;border-radius:999px;background:#fff}
.inv .bar .ps .ps-v{font-size:15px}
.inv .bar .ps .ps-list{left:0;right:auto;top:calc(100% + 8px)}
.inv .bar .ps{height:42px}
/* v40: subtext = Mulish Light 18px, letter 0, line 1.8 */
:root{--f-sub:"Mulish",var(--f)}
h1+p,h2+p,.sh p,.ptitle p,.bk-hd p,.hero2 .sub,.man-txt p,.fl-d,.sh-row+p,.split>div>h2+p{font-family:var(--f-sub)!important;font-weight:300!important;font-style:normal!important;font-size:18px!important;letter-spacing:0!important;line-height:1.8!important}
@media (max-width:700px){h1+p,h2+p,.sh p,.ptitle p,.bk-hd p,.hero2 .sub,.man-txt p,.fl-d{font-size:16px!important}}
/* office location → maps chooser */
.mapx{position:relative;display:inline-block}
.mapx-b{font:inherit;color:#fff;background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-bottom:1px solid #D7262B99;transition:border-color .3s,color .3s}
.mapx-b:hover,.mapx.open .mapx-b{border-color:var(--red)}
.mapx-b svg{width:15px;height:15px;color:var(--red)}
.mapx-m{position:absolute;left:0;top:calc(100% + 10px);z-index:30;min-width:260px;display:flex;flex-direction:column;padding:8px;background:#121214f7;border:1px solid #ffffff17;border-radius:14px;box-shadow:0 24px 50px -20px #000;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s,transform .3s cubic-bezier(.2,.7,.2,1),visibility 0s linear .3s;line-height:1.4}
.mapx.open .mapx-m{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.7,.2,1),visibility 0s}
.mapx-m small{font-size:12px;color:#ffffff73;padding:6px 10px 8px;border-bottom:1px solid #ffffff0f;margin-bottom:4px}
.mapx-m a{font-size:14.5px;color:#ffffffd9;padding:10px;border-radius:8px;transition:background-color .2s,color .2s}
.mapx-m a:hover{background:#D7262B1f;color:#fff}
/* v41: premium review cards (side strip, quote mark, invert on hover) */
.rc.rx{width:400px;display:flex;flex-direction:row;padding:0;gap:0;background:#F4F3EF;color:var(--ink);border:0;border-radius:18px;overflow:hidden;box-shadow:0 20px 40px -28px #000;transition:background-color .5s cubic-bezier(.2,.7,.2,1),color .5s,transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}
.rx-s{flex:none;width:44px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 0 18px}
.rx-s b{font-family:var(--mono);font-size:12px;font-weight:500;opacity:.9}
.rx-s span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-tech);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.rx-b{flex:1;min-width:0;padding:20px 22px 20px;display:flex;flex-direction:column;gap:14px}
.rx-t{display:flex;justify-content:space-between;align-items:center}
.rx-q{width:26px;height:20px;color:var(--c);transition:color .5s}
.rx-st{color:var(--c);letter-spacing:3px;font-size:12px;transition:color .5s}
.rc.rx p{font-family:var(--f-sub);font-weight:300;font-size:16px;line-height:1.6;color:#2A2926;transition:color .5s;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.rx-a{display:flex;align-items:center;gap:12px;margin-top:auto}
.rx-av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--c);background:#fff;box-shadow:0 0 0 1.5px var(--c);transition:background-color .5s}
.rx-a b{display:block;font-size:14.5px;font-weight:600}
.rx-a>div span{display:block;font-size:12.5px;color:#6E6A63;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .5s}
.rx-a>div{min-width:0}
.rx-g{margin-left:auto;width:22px;height:22px;color:#9A968F;flex:none}.rx-g svg{width:100%;height:100%}
.rc.rx:hover{background:#111113;color:#fff;transform:translateY(-4px);box-shadow:0 30px 60px -30px #000,0 0 0 1px #ffffff14}
.rc.rx:hover p{color:#ffffffd9}.rc.rx:hover .rx-a>div span{color:#ffffff80}.rc.rx:hover .rx-av{background:#1b1b1e}.rc.rx:hover .rx-g{color:#ffffff66}
.rc.rx[style*="#141416"]:hover .rx-q,.rc.rx[style*="#141416"]:hover .rx-st{color:#fff}
.rc.rx[style*="#141416"] .rx-s{box-shadow:inset -1px 0 0 #ffffff14}
.revs .rrow{gap:18px}.revs .rrow.rev{margin-top:18px}
@media (max-width:560px){.rc.rx{width:310px}.rc.rx p{font-size:15px}}
/* v42: Personal + business — text left, tilted photo river right */
.pbx{position:relative;background:#0B0B0C;color:#fff;overflow:hidden;padding:0}
.pbx::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 78% 50%,#D7262B1a,transparent 70%);pointer-events:none}
.pbx-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:40px;align-items:center;min-height:760px;position:relative}
.pbx-l{padding-block:110px;position:relative;z-index:2}
.pbx-l h2{color:#fff!important;margin-top:12px}
.pbx-chips{overflow:hidden;margin-bottom:26px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 78%,transparent);max-width:520px}
.pbx-chips>div{display:flex;gap:8px;width:max-content;animation:marq 26s linear infinite}
.pbx-chips span{font-size:12.5px;color:#ffffffb3;border:1px solid #ffffff1a;background:#ffffff08;border-radius:999px;padding:7px 14px;white-space:nowrap}
.pbx .pb-tabs{display:inline-flex;gap:4px;padding:4px;border:1px solid #ffffff1a;border-radius:999px;margin:26px 0 30px;background:#ffffff08}
.pbx .pb-tabs button{font:inherit;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--f-tech);font-weight:600;color:#ffffffa6;background:none;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;transition:background-color .35s,color .35s}
.pbx .pb-tabs button.on{background:var(--red);color:#fff}
.pbx-body h3{font-family:var(--f)!important;font-size:22px;font-weight:600;text-transform:none;letter-spacing:0;color:#fff;line-height:1.3}
.pbx-body>p{font-family:var(--f-sub);font-weight:300;font-size:18px;line-height:1.8;color:#ffffffa6;margin-top:10px;max-width:46ch}
.pbx-list{margin-top:24px;border-top:1px solid #ffffff14}
.pbx-list>div{display:grid;grid-template-columns:40px 1fr;column-gap:10px;padding:14px 0;border-bottom:1px solid #ffffff14}
.pbx-list i{grid-row:span 2;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--red);padding-top:3px}
.pbx-list b{font-weight:500;font-size:15.5px}
.pbx-list span{font-size:13.5px;color:#ffffff80}
.pbx-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.pbx .sq.ol{border:1px solid #ffffff59;color:#fff;background:none}.pbx .sq.ol:hover{background:#fff;color:var(--ink)}
.pbx .sq.red{border:1px solid transparent}
.pbx-wall{position:relative;height:760px;perspective:1600px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 16%,#000 84%,transparent),linear-gradient(90deg,transparent,#000 10%);-webkit-mask-composite:source-in;mask-image:linear-gradient(180deg,transparent,#000 16%,#000 84%,transparent);}
.pbx-tilt{position:absolute;inset:-18% -10% -18% 6%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;transform:rotateX(18deg) rotateY(-14deg) rotateZ(8deg);transform-style:preserve-3d;transition:opacity .45s,filter .45s}
.pbx-tilt.swap{opacity:0;filter:blur(6px)}
.pbx-col{overflow:hidden}
.pbx-track{display:flex;flex-direction:column;gap:16px;animation:pbUp 42s linear infinite}
.pbx-col.dn .pbx-track{animation-name:pbDn;animation-duration:48s}
.pbx-col:nth-child(3) .pbx-track{animation-duration:54s}
@keyframes pbUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes pbDn{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.pbx-card{aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#1a1a1c;box-shadow:0 20px 40px -20px #000,0 0 0 1px #ffffff12}
.pbx-card img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) contrast(1.05);transition:filter .6s,transform .8s cubic-bezier(.2,.7,.2,1)}
.pbx-wall:hover .pbx-track{animation-play-state:running}
@media (max-width:1000px){.pbx-in{grid-template-columns:1fr;min-height:0}.pbx-l{padding-block:80px 10px}.pbx-wall{height:420px}.pbx-tilt{inset:-20% -20% -20% -10%}}

.pbx-wall{margin-right:min(-40px,calc((1180px - 100vw)/2));-webkit-mask-image:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent)}@media (max-width:1000px){.pbx-wall{margin-right:0}}
.pbx-in>*{min-width:0}.pbx-chips{max-width:100%}
/* v43: masked parallax tab cards (manifesto + fleet, compressed) */
.ed-man{padding-block:90px 30px!important}.ed-fleet{padding-block:30px 100px!important}
.pt{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:560px;border-radius:22px;overflow:hidden;background:#161618;color:#fff;box-shadow:0 40px 80px -50px #0008}
.pt-l{position:relative;padding:44px 44px 36px;display:flex;flex-direction:column;min-width:0}
.pt-eb{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#ffffff66}
.pt-txt{position:relative;flex:1;margin-top:26px}
.pt-t{position:absolute;inset:0 0 auto 0;opacity:0;pointer-events:none;transition:opacity .5s ease}

/* 03 bankruptcy v3: lender match grid */
.bk3{width:min(280px,84%);display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:10px}
.bk3-t{display:flex;align-items:center;gap:10px;font-family:var(--f-tech);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#ffffff99}
.bk3-t i{width:4px;height:4px;background:var(--red);transform:rotate(45deg)}
.bk3-g{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;width:100%}
.bk3-g span{aspect-ratio:1;border:1px solid #ffffff24;display:grid;place-items:center;color:transparent;background:#ffffff05}
.bk3-g svg{width:55%;height:55%;stroke-width:3}
.bk3-c{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#ffffff66}
.bk3-c b{color:#ffffffb3;font-weight:500}
#credit .cr.feat-red .bk3-t{color:#fff}#credit .cr.feat-red .bk3-t i{background:#fff}
#credit .cr.feat-red .bk3-g span{border-color:#ffffff4d;background:#ffffff0f}
#credit .cr.feat-red .bk3-g span.y{animation:bk3Y .4s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.2s + var(--d)*.18s)}
#credit .cr.feat-red .bk3-g span.n{animation:bk3N .4s ease both;animation-delay:calc(.2s + var(--d)*.18s)}
@keyframes bk3Y{from{transform:scale(.6);background:#ffffff0f}to{transform:none;background:#fff;border-color:#fff;color:var(--red)}}
@keyframes bk3N{to{opacity:.35}}
#credit .cr.feat-red .bk3-c{color:#ffffffb3}#credit .cr.feat-red .bk3-c b{color:#fff}
.sd3-in{transition:border-color .6s}
.sd3-t,.sd3-r{transition:color .6s,text-shadow .6s}
.sdiv3.lit .sd3-in{border-top-color:#ffffff59}
.sdiv3.lit .sd3-t,.sdiv3.lit .sd3-r{color:#fff;text-shadow:0 0 12px #ffffff59}
/* 03 bankruptcy v4: fanned cards, a "Yes" card deals in on top */
.bk4{position:relative;width:220px;height:104px;margin-top:12px}
.bk4-c{position:absolute;left:50%;top:50%;width:66px;height:90px;margin:-45px 0 0 -33px;border:1px solid #ffffff2e;background:#141416;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 10px 24px -12px #000;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .5s,background .5s,border-color .5s}
.bk4-c small{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#ffffff66}
.bk4-c b{font-family:var(--f-tech);font-weight:800;font-size:30px;line-height:1;color:#ffffffb3}
.bk4-c em{font-style:normal;font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#ffffff59}
.bk4-c.a{transform:translateX(-40px) rotate(-10deg)}
.bk4-c.b{transform:translateX(0) rotate(0)}
.bk4-c.y{transform:translateX(40px) translateY(14px) rotate(10deg);opacity:0}
.bk4-c.y span{width:18px;height:18px;display:grid;place-items:center}.bk4-c.y svg{width:16px;height:16px;stroke-width:3}
.bk4-c.y b{font-size:22px}
#credit .cr.feat-red .bk4-c{border-color:#ffffff59;background:#b81f24}
#credit .cr.feat-red .bk4-c small,#credit .cr.feat-red .bk4-c em{color:#ffffffb3}#credit .cr.feat-red .bk4-c b{color:#fff}
#credit .cr.feat-red .bk4-c.a{transform:translateX(-62px) rotate(-14deg)}
#credit .cr.feat-red .bk4-c.b{transform:translateX(-10px) rotate(-3deg)}
#credit .cr.feat-red .bk4-c.y{opacity:1;background:#fff;border-color:#fff;transform:translateX(52px) rotate(9deg);transition-delay:.35s;box-shadow:0 16px 30px -12px #000a}
#credit .cr.feat-red .bk4-c.y b,#credit .cr.feat-red .bk4-c.y span{color:var(--red)}#credit .cr.feat-red .bk4-c.y em{color:#D7262Bb3}
.bk4{width:260px}
.bk4-c.a{transform:translateX(-44px) rotate(-8deg)}.bk4-c.b{transform:translateX(18px) rotate(3deg)}

function gaugeSVG(){
  const cx=200,cy=200,r=160,start=225,sweep=270;

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LOOP=5200; // ms per float cycle
function logoHover(host){
  const fx=host.querySelector('.fx'),sh=host.querySelector('.sheen');if(!fx||fx._fx)return;fx._fx=1;
  let ph=0,rate=0,target=0,raf=0,last=0;
  const draw=()=>{const s=(1-Math.cos(ph*2*Math.PI))/2; // 0→1→0, smooth
    const y=-1.5*rate-2.2*s,k2=1+.008*rate+.012*s;fx.style.transform=`translate3d(0,${y.toFixed(3)}%,0) scale(${k2.toFixed(4)})`;

  const tick=t=>{const dt=Math.min(.05,(t-(last||t))/1000);last=t;
    rate+=(target-rate)*Math.min(1,dt*(target?4:2.2)); // fast in, gentle out

/* ================= smooth, fast wheel scrolling (desktop mouse only; touch/trackpad-native untouched for keyboard, scrollbar, anchors) ================= */
(function(){
  if(RM||!matchMedia('(pointer:fine)').matches)return;
  document.documentElement.style.scrollBehavior='auto';
  let cur=scrollY,tgt=scrollY,raf=0;
  const max=()=>document.documentElement.scrollHeight-innerHeight;
  const scrollableParent=el=>{for(;el&&el!==document.body;el=el.parentElement){const s=getComputedStyle(el);if(/(auto|scroll)/.test(s.overflowY)&&el.scrollHeight>el.clientHeight)return el}return null};
  const step=()=>{cur+=(tgt-cur)*.2;if(Math.abs(tgt-cur)<.5)cur=tgt;window.scrollTo(0,cur);raf=cur===tgt?0:requestAnimationFrame(step)};
  addEventListener('wheel',e=>{
    if(e.ctrlKey||e.defaultPrevented||Math.abs(e.deltaX)>Math.abs(e.deltaY)||scrollableParent(e.target))return;
    e.preventDefault();
    const d=e.deltaMode===1?e.deltaY*32:e.deltaMode===2?e.deltaY*innerHeight:e.deltaY;
    if(!raf)cur=tgt=scrollY;
    tgt=Math.max(0,Math.min(max(),tgt+d*1.05));
    if(!raf)raf=requestAnimationFrame(step);
  },{passive:false});
  addEventListener('scroll',()=>{if(!raf){cur=tgt=scrollY}},{passive:true});
  addEventListener('hashchange',()=>{cancelAnimationFrame(raf);raf=0;cur=tgt=scrollY});
})();

/* ================= "We say yes" auto-playing stepper (Onboarding Flow Pro style) ================= */
function yesStepper(){
  const root=document.getElementById('ysx');if(!root||root._on)return;root._on=1;
  const steps=[...root.querySelectorAll('.ysx-s')],lines=[...root.querySelectorAll('.ysx-ln')],cards=[...document.querySelectorAll('#credit .cr')];
  const N=steps.length,DWELL=2600,LINE=900;let cur=0,t0=0,raf=0,vis=false,prog=0,shown=0;
  const tl=document.getElementById('ysxTL'),dots=tl?[...tl.querySelectorAll('span')]:[],segs=tl?[...tl.querySelectorAll('i u')]:[];
  const paint=()=>{steps.forEach((s,i)=>{s.classList.toggle('done',i<cur);s.classList.toggle('on',i===cur)});
    cards.forEach((c,i)=>{c.classList.toggle('feat-red',i===cur);c.classList.toggle('dim',i!==cur)});};
  const setLine=(i,k)=>{const l=lines[i];if(l)l.style.setProperty('--k',k)};
  const go=i=>{cur=i;t0=performance.now();lines.forEach((l,j)=>setLine(j,j<i?1:0));paint()};
  const tick=t=>{raf=0;if(!vis)return;const e=t-t0;
    // progress target: each step is 1/N; eases within the step
    const within=Math.min(1,e/(DWELL+LINE));const target=(cur+within)/N*100;prog+=(target-prog)*.08;
    if(tl){const f=Math.max(0,Math.min(dots.length-1,prog/100*N));dots.forEach((d,i)=>d.classList.toggle('on',f>=i-.02));segs.forEach((u,i)=>u.style.width=(Math.max(0,Math.min(1,f-i))*100).toFixed(2)+'%')}
    if(cur<N-1&&e>DWELL)setLine(cur,Math.min(1,(e-DWELL)/LINE));
    if(e>DWELL+LINE){if(cur<N-1)go(cur+1);else if(e>DWELL+LINE+1400){prog=0;go(0)}}
    raf=requestAnimationFrame(tick)};
  steps.forEach((s,i)=>s.addEventListener('click',()=>{prog=i/N*100;go(i)}));
  new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(vis&&!raf){t0=performance.now()-Math.min(performance.now()-t0,DWELL);raf=requestAnimationFrame(tick)}},{threshold:.25}).observe(root);
  go(0);
}
new MutationObserver(()=>{if(document.getElementById('ysx'))yesStepper()}).observe(document.getElementById('root')||document.body,{childList:true});

function revMotion(){
  document.querySelectorAll('.revs .rrow').forEach((row,k)=>{if(row._rv)return;row._rv=1;row.style.animation='none';
    const base=(k?-1:1)*38; // px/s; row 2 drifts the other way
    let v=base,target=base,x=k?-row.scrollWidth/2:0,last=0;
    
    const step=t=>{if(!row.isConnected)return;const dt=Math.min(.05,(t-(last||t))/1000);last=t;v+=(target-v)*Math.min(1,dt*2.2);
      const half=row.scrollWidth/2;x-=v*dt;if(x<=-half)x+=half;if(x>0)x-=half;row.style.transform=`translate3d(${x}px,0,0)`;requestAnimationFrame(step)};
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(step)});
}

/* ================= segmented speedometer (overrides gaugeSVG) ================= */
function gaugeSVG(){
  const cx=200,cy=200,N=34,start=-135,sweep=270,cols=['#F0524F','#F0524F','#F57C45','#F9A23C','#FCC53A','#FBD84A','#7FD07A','#4CC08A','#4A9DF0'];
  const lerp=(a,b,t)=>Math.round(a+(b-a)*t),hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const colAt=f=>{const x=f*(cols.length-1),i=Math.min(cols.length-2,Math.floor(x)),t=x-i,a=hex(cols[i]),b=hex(cols[i+1]);return `rgb(${lerp(a[0],b[0],t)},${lerp(a[1],b[1],t)},${lerp(a[2],b[2],t)})`};
  let s='';for(let i=0;i<N;i++){const f=i/(N-1),a=(start+f*sweep-90)*Math.PI/180,r0=128,r1=162,x0=cx+r0*Math.cos(a),y0=cy+r0*Math.sin(a),x1=cx+r1*Math.cos(a),y1=cy+r1*Math.sin(a);
    s+=`<line class="gseg" data-c="${colAt(f)}" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#ffffff1a" stroke-width="7" stroke-linecap="round"/>`}
  return `<svg viewBox="0 0 400 400" aria-hidden="true" class="gsv">${s}<g id="gArc"></g><g id="gNeedle"></g></svg>`;
}
function gaugeRun(){const g=document.getElementById('gauge');if(!g||g._seg)return;g._seg=1;const segs=[...g.querySelectorAll('.gseg')],N=segs.length,TARGET=Math.round(N*.88);
  let raf=0,last=-1e9,shown=false;
  const reset=()=>{cancelAnimationFrame(raf);raf=0;segs.forEach(s=>{s.style.stroke='';s.classList.remove('on')});const n=document.getElementById('gNum');if(n)n.textContent='0'};
  const play=()=>{reset();last=performance.now();const t0=last,n=document.getElementById('gNum');let lit=0;
    const step=t=>{const k=Math.min(1,(t-t0)/2000),e=1-Math.pow(1-k,3),want=Math.round(TARGET*e);
      while(lit<want){const s=segs[lit];s.style.stroke=s.dataset.c;s.classList.add('on');lit++}
      if(n)n.textContent=Math.round(24*e);
      raf=k<1?requestAnimationFrame(step):0};raf=requestAnimationFrame(step)};
  new IntersectionObserver(es=>{const e=es[0];
    if(e.isIntersecting&&e.intersectionRatio>=.4){if(!shown){shown=true;play()}}
    else if(!e.isIntersecting){shown=false;reset()}},{threshold:[0,.4]}).observe(g);
  g.addEventListener('pointerenter',()=>{if(shown&&performance.now()-last>=7000)play()})}
new MutationObserver(()=>{if(document.getElementById('gauge'))gaugeRun()}).observe(document.getElementById('root')||document.body,{childList:true});

/* spotlight + horizontal drift on the giant wordmark */
function fxBind(){const w=document.getElementById('fxWord');if(!w||w._on)return;w._on=1;
  const tracks=w.querySelectorAll('.fx-track');let tx=0,x=0,mx=.5,my=.5,sx=.5,sy=.5,raf=0,inside=false;
  const loop=()=>{x+=(tx-x)*.06;sx+=(mx-sx)*.14;sy+=(my-sy)*.14;
    tracks.forEach(t=>t.style.transform=`translate3d(${x.toFixed(2)}px,0,0)`);
    w.style.setProperty('--sx',(sx*100).toFixed(2)+'%');w.style.setProperty('--sy',(sy*100).toFixed(2)+'%');w.style.setProperty('--sa',inside?1:0);
    raf=w.isConnected?requestAnimationFrame(loop):0};
  const f=w.closest('footer');
  f.addEventListener('pointermove',e=>{const r=w.getBoundingClientRect(),span=w.querySelector('.fx-track span').offsetWidth;const px=(e.clientX-r.left)/r.width;
    tx=-(span-r.width)*px;mx=px;my=(e.clientY-r.top)/r.height;inside=e.clientY>r.top-60});
  f.addEventListener('pointerleave',()=>{inside=false});
  new IntersectionObserver(es=>{if(es[0].isIntersecting&&!raf)raf=requestAnimationFrame(loop)}).observe(w);
  // idle drift when no pointer (touch)
  if(matchMedia('(pointer:coarse)').matches){let t0=performance.now();const idle=t=>{const r=w.getBoundingClientRect(),span=w.querySelector('.fx-track span').offsetWidth;tx=-(span-r.width)*(.5+.5*Math.sin((t-t0)/5000));mx=.5+.35*Math.sin((t-t0)/3000);my=.55;inside=true;if(w.isConnected)requestAnimationFrame(idle)};requestAnimationFrame(idle)}
}
