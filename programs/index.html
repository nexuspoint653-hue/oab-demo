<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Programs · O Auto Brokers</title>
<meta name="description" content="Every program O Auto Brokers offers, in one place.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0C">
<meta property="og:type" content="website">
<meta property="og:title" content="O Auto Brokers · Our Programs">
<meta property="og:description" content="9 programs and counting. Tap to view the full list.">
<meta property="og:image" content="https://oautobrokers.pages.dev/programs/og.png">
<meta property="og:url" content="https://oautobrokers.pages.dev/programs/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../brand/oab-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0B0C;--ink2:#141416;--ink3:#1C1C1F;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);--tx:#F4F4F1;--tx2:#A6A7AB;--tx3:#6E7076;--red:#D7262B;--red2:#B81E23;
 --f:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;--ft:"Chakra Petch","Geist",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--tx);font-family:var(--f);min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(700px 420px at 50% -10%,rgba(215,38,43,.18),transparent 65%),var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
main{width:min(560px,100%);margin:0 auto;padding:44px 20px 30px;flex:1}
.hd{display:flex;flex-direction:column;align-items:center;text-align:center}
.hd img{width:76px;height:76px;border-radius:50%;box-shadow:0 18px 40px -14px rgba(215,38,43,.55);opacity:0;animation:up .7s .05s cubic-bezier(.2,.7,.2,1) forwards}
.eb{margin-top:20px;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);display:flex;align-items:center;gap:8px;opacity:0;animation:up .7s .12s cubic-bezier(.2,.7,.2,1) forwards}
.eb i{width:6px;height:6px;border-radius:50%;background:var(--red)}
h1{font-family:var(--ft);font-weight:700;text-transform:uppercase;font-size:clamp(36px,10vw,52px);line-height:1;margin-top:10px;opacity:0;animation:up .7s .2s cubic-bezier(.2,.7,.2,1) forwards}
h1 em{font-style:normal;color:var(--red)}
.sub{color:var(--tx2);font-size:15px;margin-top:10px;opacity:0;animation:up .7s .28s cubic-bezier(.2,.7,.2,1) forwards}
.list{list-style:none;margin-top:30px;display:grid;gap:8px}
.it{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));opacity:0;animation:up .55s cubic-bezier(.2,.7,.2,1) forwards}
.it b{font-family:var(--ft);font-size:13px;color:var(--red);width:24px;flex:none;letter-spacing:.04em}
.it span{font-size:17px;font-weight:500;letter-spacing:-.005em;flex:1}
.it em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--red);color:#fff;padding:3px 8px;border-radius:999px}
.it .x{width:28px;height:28px;border-radius:8px;color:var(--tx3);display:grid;place-items:center;transition:color .2s,background .2s}
.it .x:hover{color:var(--tx);background:var(--ink3)}
.it .x svg{width:14px;height:14px}
.add{margin-top:12px;width:100%;height:56px;border-radius:14px;border:1px dashed var(--line2);display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:500;color:var(--tx2);transition:border-color .2s,color .2s,background .2s;opacity:0;animation:up .55s 1s cubic-bezier(.2,.7,.2,1) forwards}
.add:hover{border-color:var(--red);color:var(--tx);background:rgba(215,38,43,.06)}
.add i{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.add svg{width:14px;height:14px}
.cta{display:flex;gap:8px;margin-top:22px;opacity:0;animation:up .55s 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.cta a{flex:1;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.cta a:first-child{background:var(--red);color:#fff}.cta a:first-child:hover{background:var(--red2)}
.cta a:last-child{border:1px solid var(--line2)}.cta a:last-child:hover{background:var(--ink3)}
footer{border-top:1px solid var(--line);padding:24px 20px calc(26px + env(safe-area-inset-bottom));text-align:center}
footer p{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
footer a{display:inline-block;margin-top:12px;opacity:.85;transition:opacity .2s}
footer a:hover{opacity:1}
footer img{height:28px;width:auto;display:block}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);transform:translate(-50%,105%);background:var(--ink2);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));z-index:21;visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:translate(-50%,0);visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 16px}
.sheet h2{font-size:20px;font-weight:600}
.sheet p.h{font-size:13.5px;color:var(--tx2);margin-top:4px}
.fld{display:block;margin-top:14px}
.fld span{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:6px;font-weight:500}
.fld input,.fld textarea{width:100%;border-radius:12px;border:1px solid var(--line2);background:var(--ink3);color:var(--tx);font:inherit;font-size:16px;padding:14px;outline:none;transition:border-color .2s,box-shadow .2s;resize:none}
.fld input{height:52px;padding:0 14px}
.fld input:focus,.fld textarea:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(215,38,43,.15)}
.row{display:flex;gap:8px;margin-top:18px}
.row button{height:52px;border-radius:12px;font-weight:600;font-size:15px}
.row .c{padding:0 18px;color:var(--tx2)}.row .c:hover{background:var(--ink3);color:var(--tx)}
.row .s{flex:1;background:var(--red);color:#fff;transition:background .2s,opacity .2s}.row .s:hover{background:var(--red2)}.row .s:disabled{opacity:.35}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;background:var(--tx);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;transition:all .3s;z-index:30;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
 <header class="hd">
  <img src="../brand/oab-logo-160.png" alt="O Auto Brokers">
  <div class="eb"><i></i>O Auto Brokers &amp; Leasing</div>
  <h1>Our <em>Programs</em></h1>
  <p class="sub" id="count">9 programs available now</p>
 </header>
 <ul class="list" id="list"></ul>
 <button class="add" type="button" id="addBtn"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></i>Add a program</button>
 <div class="cta"><a href="../start/">Get pre-qualified</a><a href="../">Full website</a></div>
</main>
<footer>
 <p>Designed &amp; built by</p>
 <a href="https://frameworksstudio.net" target="_blank" rel="noopener" aria-label="FrameWorks Studio"><img src="../brand/fws-long.png" alt="FrameWorks Studio"></a>
</footer>

<div class="scrim" id="scrim"></div>
<form class="sheet" id="sheet" novalidate aria-label="Add a program">
 <div class="grab"></div>
 <h2>Add a program</h2>
 <p class="h">Tell us the name and who it’s for. We’ll build it in.</p>
 <label class="fld"><span>Program name</span><input id="pn" maxlength="60" placeholder="e.g. Rideshare Drivers" autocomplete="off"></label>
 <label class="fld"><span>Who it’s for (optional)</span><textarea id="pd" rows="2" maxlength="200" placeholder="e.g. Uber and Lyft drivers who need a newer car"></textarea></label>
 <div class="row"><button type="button" class="c" id="cancel">Cancel</button><button type="submit" class="s" id="save" disabled>Add program</button></div>
</form>
<div class="toast" id="toast"></div>

<script>
(function(){
const BASE=['Credit to Car','Single Moms Package','Truck Drivers Program','Challenged Credit','Veterans Program','Nurses Program','Influencers Package','Long-Term Rental','Car Payment Help'];
const TO='adamshamsedin@frameworksstudio.net';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let extra=[];try{extra=JSON.parse(localStorage.getItem('oab_prog_extra')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('oab_prog_extra',JSON.stringify(extra))}catch(e){}};
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
function paint(anim){
 const all=BASE.map(n=>({n})).concat(extra.map((e,i)=>({n:e.n,ex:i})));
 $('#list').innerHTML=all.map((p,i)=>`<li class="it" style="animation-delay:${anim?(.38+i*.06).toFixed(2):0}s"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(p.n)}</span>${p.ex!=null?`<em>New</em><button class="x" type="button" data-x="${p.ex}" aria-label="Remove">${X}</button>`:''}</li>`).join('');
 $('#count').textContent=all.length+' programs available now';
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{extra.splice(+b.dataset.x,1);save();paint()});
}
paint(true);
const body=document.body,pn=$('#pn'),pd=$('#pd'),sv=$('#save');
const open=()=>{body.classList.add('open');setTimeout(()=>pn.focus(),320)};
const close=()=>{body.classList.remove('open');$('#sheet').reset();sv.disabled=true};
$('#addBtn').onclick=open;$('#cancel').onclick=close;$('#scrim').onclick=close;
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
pn.oninput=()=>sv.disabled=pn.value.trim().length<2;
$('#sheet').onsubmit=e=>{e.preventDefault();const n=pn.value.trim(),d=pd.value.trim();if(n.length<2)return;
 extra.push({n,d,at:Date.now()});save();paint();close();
 const t=$('#toast');t.textContent=n+' added';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400);
 const subj='New program request: '+n,bd='Program: '+n+(d?'\nWho it\'s for: '+d:'')+'\n\nSent from oautobrokers.pages.dev/programs';
 setTimeout(()=>{location.href='mailto:'+TO+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(bd)},500);
};
})();
</script>
</body>
</html>
